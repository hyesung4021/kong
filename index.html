<style>
/* Layout: phone-first, calm white work surface; gold (from the logo) is the only accent; thin borders instead of heavy shadows; floating pill tab bar; bottom sheets. */
:root{
  --sky:#CDE6FB; --dawn:#EAF4FF;
  --bg:#F8FBFF; --surface:#FFFFFF; --surface-2:#F1F6FB; --ink:#18191C; --muted:#6B6F78; --line:#E4E6EA; --tline:#EEF2F7; --tline-2:#BFD8EE;
  --accent:#2F7FC1; --accent-ink:#FFFFFF; --accent-soft:#E6F1FB;
  --sun:#2BB3D6; --sun-soft:#E2F6FB; --sun-ink:#0C86A8;
  --ok:#2E7D5B; --ok-soft:#E3F2EA; --warn:#EC7A12; --warn-soft:#FFF1E2; --bad:#C2412D; --bad-soft:#FBE4DF;
  --shadow:0 1px 2px rgba(16,18,22,.04), 0 4px 14px rgba(16,18,22,.04);
  --font-num:"Barlow","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#17233B; --dawn:#271D2B;
  --bg:#111214; --surface:#1A1C20; --surface-2:#23262B; --ink:#ECECEE; --muted:#9A9DA5; --line:#2C2F35; --tline:#24282F; --tline-2:#2F4A66;
  --accent:#7DB8EA; --accent-ink:#0D1622; --accent-soft:#182838;
  --sun:#5FCDE6; --sun-soft:#12303A; --sun-ink:#8FDDEE;
  --ok:#6CCB9E; --ok-soft:#16302A; --warn:#FFA45C; --warn-soft:#36240F; --bad:#F08A76; --bad-soft:#3A1C16;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#17233B; --dawn:#271D2B;
  --bg:#111214; --surface:#1A1C20; --surface-2:#23262B; --ink:#ECECEE; --muted:#9A9DA5; --line:#2C2F35; --tline:#24282F; --tline-2:#2F4A66;
  --accent:#7DB8EA; --accent-ink:#0D1622; --accent-soft:#182838;
  --sun:#5FCDE6; --sun-soft:#12303A; --sun-ink:#8FDDEE;
  --ok:#6CCB9E; --ok-soft:#16302A; --warn:#FFA45C; --warn-soft:#36240F; --bad:#F08A76; --bad-soft:#3A1C16;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.skybg{background:linear-gradient(180deg,var(--sky) 0%,var(--dawn) 280px,var(--bg) 520px) no-repeat;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 140px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px}
.circle-btn{width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);display:grid;place-items:center;flex:none}
.circle-btn svg{width:20px;height:20px}
.logo{display:block;margin:0 auto;height:50px;width:auto}
.logo.big{height:96px}
.brand{flex:1;text-align:center;font-family:var(--font-num);font-weight:600;letter-spacing:.22em;font-size:13px;color:var(--accent)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
.hello{display:flex;flex-direction:column;gap:2px}
.hello .date{font-size:13px;color:var(--muted)}
.hello h1{margin:0;font-size:23px;line-height:1.3;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;text-align:center}
.card .kpi{border:0;background:var(--surface-2)}
.kpi b{font-family:var(--font-num);font-size:24px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);white-space:nowrap}
.kpi.alert b{color:var(--bad)} .kpi.sun b{color:var(--sun-ink)} .kpi.good b{color:var(--ok)}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;gap:16px}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-num);font-size:20px;font-weight:500}
.prog .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.prog .txt strong{font-size:16px}
.prog .txt span{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-head{display:flex;align-items:center;gap:10px}
.card-head h2{margin:0;font-size:16px;font-weight:700;flex:1;min-width:0}
.card-head .more{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}
.list{display:flex;flex-direction:column}

<script>
(function(){

/* ================= 유틸 ================= */

const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const WD = ["일","월","화","수","목","금","토"], WDL = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
const todayStr = () => ymd(new Date());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const addMonths = (s,n) => { const d=parse(s); d.setMonth(d.getMonth()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parse(a)-parse(b))/86400000);
const dLabel = s => { const d=parse(s); return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"; };
const dShort = s => { const d=parse(s); return (d.getMonth()+1)+"/"+d.getDate(); };
const dLong = s => { const d=parse(s); return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+WDL[d.getDay()]; };
const won = n => (Math.round(Number(n)||0)).toLocaleString("ko-KR")+"원";
const comma = n => (Math.round(Number(n)||0)).toLocaleString("ko-KR");
const manwon = n => { n=Number(n)||0; if (Math.abs(n)>=10000000) return Math.round(n/10000).toLocaleString("ko-KR")+"만"; return Math.abs(n)>=10000 ? (Math.round(n/1000)/10).toLocaleString("ko-KR")+"만" : n.toLocaleString("ko-KR"); };
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const month = s => s ? String(s).slice(0,7) : "";
const monday = s => { const d=parse(s); const k=(d.getDay()+6)%7; return addDays(s,-k); };
const monthEnd = mo => { const [y,m]=mo.split("-").map(Number); return ymd(new Date(y,m,0)); };

function show(id){ ["authView","pendingView","appView"].forEach(v => $("#"+v).hidden = v!==id); }

  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>'
};

/* ================= 상태 ================= */
const CORE = ["trainers","members","lessons"];
const TABLES = ["trainers","members","lessons","payments","leads","bodies","deals","blocks","promo_daily","apt_promos","reviews","fac_tasks","repairs","supplies","app_settings","notices","meetings","duties","rosters"];
const S = {}; TABLES.forEach(t => S[t] = {});
const missing = new Set();
let me = null;
let tab = store.get("sg_tab") || "today", selDay = todayStr(), query = "";
let scope = store.get("sg_scope") || "mine", mFilter = "active", tierF = "", lFilter = "open", trFilter = "", statMonth = month(todayStr());

let promoSeg = "inquiry", opsSeg = "sales", facSeg = "todo";

/* ================= 설정 ================= */
const DEFAULTS = { tier1:10, tier2:30, renew:5, inquiryGoal:20, aptGoal:10, newRegGoal:5, ptNewGoal:2, reviewGoal:4, gymName:"더스카이짐 헬스&PT 일산본점" };
/* 아파트 홍보 단지 · 동 · 라인 */
const APTS = [
  {name:"메가시티", homes:178, dongs:[["전체",["전체"]]]},

];

/* ================= 데이터 ================= */
const CFG = window.SKYGYM_CONFIG || {};
const DEMO = !CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY;
const LIBFAIL = !DEMO && !window.supabase;
const sb = (DEMO || LIBFAIL) ? null : window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
async function fetchAll(table){
  const out = []; let from = 0; const size = 1000;
  for(;;){ const { data, error } = await sb.from(table).select("*").range(from, from+size-1); if (error) throw error; out.push(...data); if (data.length < size) break; from += size; }
  return out;
}
const api = {
  async loadAll(){
    if (DEMO) return;
    missing.clear();
    const res = await Promise.all(TABLES.map(t => fetchAll(t).catch(e => { if (CORE.includes(t)) throw e; missing.add(t); return []; })));
    TABLES.forEach((t,i) => { const m={}; res[i].forEach(r => m[r.id]=r); S[t]=m; });
  },
  async save(table, row){
    row = Object.assign({}, row); if (!row.id) row.id = uid();
    if (!DEMO){ const { data, error } = await sb.from(table).upsert(row).select().single(); if (error) throw error; row = data; }
    S[table][row.id] = row; return row;
  },
  async remove(table, id){

    <div class="sub" style="white-space:normal">${esc(tName(q.by||(isL?lt(r):r.trainer_id)))} 요청${q.reason?" · "+esc(q.reason):""}</div></div>

async function decideCancel(t, id, ok){
  const r = S[t][id]; if (!r) return;
  if (!isOwner()){ toast("수업 취소 승인 권한이 없어요"); return; }
  if (ok){ await safe(() => api.remove(t, id), "수업을 취소했어요"); }
  else { const row = Object.assign({}, r); row.cancel_req = null; await safe(() => api.save(t, row), "취소 요청을 거절했어요 (일정 유지)"); }
}
function cancelReqBox(s, t, r){  /* 트레이너용 요청 입력 */
  const box = s.querySelector("#cancelBox");
  box.innerHTML = `<div class="confirm"><b>관리자에게 취소 요청</b><div class="field" style="margin-top:8px"><input id="cr_reason" maxlength="60" placeholder="사유 (예: 회원 개인사정, 병원)"></div>

  box.querySelector("[data-cr=send]").addEventListener("click", async () => {
    const row = Object.assign({}, r, {cancel_req:{by:me&&me.id, at:new Date().toISOString(), reason:box.querySelector("#cr_reason").value.trim()}});
    if (await safe(() => api.save(t, row), "관리자에게 취소 요청을 보냈어요")) closeSheet(); });
}
function cancelSheet(lid){  /* ✕ 수업 취소: 트레이너는 사유와 함께 요청, 관리자는 바로 취소 */
  const l = S.lessons[lid]; if (!l) return;
  const admin = isOwner();
  openSheet(`${head("수업 취소")}
    <div class="sub" style="white-space:normal">${esc(lname(l))} · ${esc(dLong(l.date))} ${esc(l.time)} · ${l.kind==="ot"?"OT":"PT "+esc(sessionNo(l))}</div>
    <form id="xcf" class="form"><div class="field"><label for="xc_r">취소 이유</label><input id="xc_r" maxlength="60" required placeholder="예: 회원 개인사정, 병원, 출장"></div>
      ${admin?"":''}
      <button class="btn danger block" type="submit">${admin?"수업 취소하기":"취소 요청 보내기"}</button></form>`, s => {
    s.querySelector("#xc_r").focus();
    s.querySelector("#xcf").addEventListener("submit", async e => { e.preventDefault();
      const reason = s.querySelector("#xc_r").value.trim(); if (!reason){ toast("취소 이유를 적어 주세요"); return; }

      const row = Object.assign({}, l, {cancel_req:{by:me&&me.id, at:new Date().toISOString(), reason}});
      if (await safe(() => api.save("lessons", row), "관리자에게 취소 요청을 보냈어요")) closeSheet(); });

}
async function withdrawCancel(t, r){ const row = Object.assign({}, r); row.cancel_req = null; if (await safe(() => api.save(t, row), "취소 요청을 거뒀어요")) closeSheet(); }
const staffList = () => vals("trainers").sort((a,b) => (b.role==="admin")-(a.role==="admin") || byName(a,b));   /* 직원 전체 */
const trainerList = () => staffList().filter(t => t.teaches!==false);   /* 수업하는 사람만 (스케줄·담당·매출) */
const ownerOf = t => DEMO ? !!(t && t.id==="t1") : isOwnerT(t);
const roleName = t => ownerOf(t) ? "관리자" : t && t.role==="admin" ? "관리자" : t && t.role==="fc" ? "FC" : "트레이너";
const tTitle = t => (t && t.title) || (t && t.role==="admin" ? "매니저" : "트레이너");
const tName = id => id==="공동" ? "공동" : !id ? "담당 미지정" : (S.trainers[id] ? S.trainers[id].name : "퇴사한 트레이너");
const tier = m => { const s=SET(), l=leftOf(m); return l < s.tier1 ? 1 : l < s.tier2 ? 2 : 3; };
const tierName = k => { const s=SET(); return k===1 ? `${s.tier1}회 미만` : k===2 ? `${s.tier1}–${s.tier2-1}회` : `${s.tier2}회 이상`; };
function sessionNo(l){
  if (l.kind==="ot") return "OT";
  const m = S.members[l.member_id]; if (!m) return "";
  const ls = vals("lessons").filter(x => x.member_id===m.id && x.kind!=="ot" && (counts(x) || x.status==="booked")).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const i = ls.findIndex(x => x.id===l.id); if (i<0) return "";
  return `${m.total}/${(Number(m.used_before)||0) + i + 1}`;
}
function flags(m){
  const f = []; if (m.status==="ended") return [{k:"ended",t:"종료",c:"mute"}];
  if (m.status==="paused") f.push({k:"paused",t:"홀딩",c:"mute"});
  const left = leftOf(m), dd = dday(m), R = SET().renew;
  if (left===0) f.push({k:"renew",t:"세션 소진",c:"bad"}); else if (left<=R) f.push({k:"renew",t:"재등록 임박",c:"warn"});
  if (dd!==null && dd<0) f.push({k:"expire",t:"기간 만료",c:"bad"}); else if (dd!==null && dd<=14) f.push({k:"expire",t:"D-"+dd,c:"warn"});
  if (m.status!=="paused" && left>0){ const ld = lastDone(m.id), nb = nextBooked(m.id); const since = ld ? diffDays(todayStr(), ld) : diffDays(todayStr(), m.created_at||todayStr());
    if (since>=14 && !nb) f.push({k:"idle",t:since+"일 미방문",c:"sun"}); }
  return f;
}
const needsCare = m => flags(m).some(f => f.k==="renew"||f.k==="expire"||f.k==="idle");
const lessonsOn = (day, pred) => vals("lessons").filter(l => l.date===day && (pred ? pred(l) : inScopeL(l))).sort((a,b)=>a.time.localeCompare(b.time));
const blocksOn = (day, tid) => vals("blocks").filter(b => b.date===day && (!tid || b.trainer_id===tid)).sort((a,b)=>a.time.localeCompare(b.time));
function salesWeeks(mo){ const end = Number(monthEnd(mo).slice(8)); const w=[]; for (let s=1;s<=end;s+=7) w.push({from:`${mo}-${pad(s)}`, to:`${mo}-${pad(Math.min(end,s+6))}`}); return w; }
const promoWeeks = mo => salesWeeks(mo); /* 1주차 = 1~7일, 2주차 = 8~14일 … (매출·홍보 같은 기준) */
const CYCLE = {"매일":1,"매주":7,"격주":14,"매월":30,"분기":90,"반기":180};
function taskState(t){
  if (!t.last_done) return {k:"todo",t:"미실시",c:"warn",next:null};
  const next = addDays(t.last_done, CYCLE[t.cycle]||7), today = todayStr();
  if (t.result==="X") return {k:"bad",t:"이상",c:"bad",next};
  if (next < today) return {k:"late",t:"기한 지남",c:"bad",next};
  if (next === today) return {k:"due",t:"오늘",c:"sun",next};
  return {k:"ok",t:"완료",c:"ok",next};
}
const supplyState = s => s.qty===null||s.qty===undefined||s.qty==="" ? {k:"none",t:"입력 필요",c:"mute"} : Number(s.qty) <= Number(s.min_qty||0) ? {k:"order",t:"발주 필요",c:"bad"} : {k:"ok",t:"충분",c:"ok"};
function facTodo(){
  const ts = vals("fac_tasks"); const st = t => taskState(t).k;
  return { order: vals("supplies").filter(s=>supplyState(s).k==="order").length, bad: ts.filter(t=>st(t)==="bad").length,
    checkDue: ts.filter(t=>t.kind==="check" && ["todo","late","due"].includes(st(t))).length, cleanDue: ts.filter(t=>t.kind==="clean" && ["todo","late","due"].includes(st(t))).length,
    repairing: vals("repairs").filter(r=>r.status!=="완료").length };
}

const noticeShown = n => n.pinned || n.date===todayStr() || (diffDays(todayStr(), n.date)<=3 && me && !(n.read_by||[]).includes(me.id));
const readBy = n => Array.isArray(n.read_by) ? n.read_by : [];
function myActions(){ const out=[]; vals("meetings").forEach(g => (g.actions||[]).forEach((a,i) => { if (!a.done && me && a.owner===me.id) out.push({g,a,i}); })); return out.sort((x,y)=>(x.a.due||"9").localeCompare(y.a.due||"9")); }
function noticeRow(n){

  return `<div class="row"><div class="grow tap" data-notice="${esc(n.id)}"><div class="name" style="white-space:normal;font-weight:${n.important?700:500}">${n.important?'<span class="pill bad">중요</span> ':""}${n.pinned?'<span class="pill sun">고정</span> ':""}${esc(n.body)}</div>

    ${mineRead?'<span class="pill ok">확인</span>':`<button class="btn okb small" data-read="${esc(n.id)}">확인했어요</button>`}</div>`;

function actionRow(g,a,i){
  const late = a.due && a.due < todayStr() && !a.done;
  return `<div class="row"><button class="qa" data-aitem="${esc(g.id)}|${i}" aria-label="완료 표시"><span style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:${a.done?"var(--ok-soft)":"var(--surface-2)"};color:var(--ok)">${a.done?ICON.check:""}</span></button>
    <div class="grow tap" data-meeting="${esc(g.id)}"><div class="name" style="white-space:normal;${a.done?"text-decoration:line-through;color:var(--muted)":""}">${esc(a.t)}</div><div class="sub">${esc(tName(a.owner))}${a.due?` · ${dLabel(a.due)}까지`:""} · ${esc(g.title||"회의")}</div></div>${late?'<span class="pill bad">지남</span>':""}</div>`;
}

  const sub = [ot?"OT":"", scope!=="mine"||opt.showT ? tName(lt(l)) : "", ot?"":sessionNo(l), !ot&&m ? `잔여 ${leftOf(m)}` : "", l.note || ""].filter(Boolean).join(" · ");
  const quick = l.status==="booked" && myLesson(l) ? `<div class="qa"><button class="ns" data-xcancel="${esc(l.id)}" aria-label="수업 취소">${ICON.x}</button>${l.date<=todayStr()?`<button class="done" data-quick="done" data-id="${esc(l.id)}" aria-label="완료">${ICON.check}</button>`:""}</div>` : (st || `<span class="pill ${ot?"sun":"hot"}">${ot?"OT 예정":"예정"}</span>`);

function blockRow(b){ return `<div class="row tap" data-block="${esc(b.id)}"><div class="time" style="color:var(--muted)">${esc(b.time)}</div><div class="grow"><div class="name" style="color:var(--muted)">${esc(b.kind)}</div><div class="sub">${esc([scope!=="mine"?tName(b.trainer_id):"", b.memo].filter(Boolean).join(" · ")||"개인 일정")}</div></div>${b.cancel_req?reqPill(b):'<span class="pill mute">일정</span>'}</div>`; }
function memberRow(m){

      ${pd ? `<div class="statgrid s3"><div class="stat"><b>${pd.visitors??0}</b><span>입장객</span></div><div class="stat"><b>${(+pd.naver||0)+(+pd.walkin||0)+(+pd.phone||0)}</b><span>문의</span></div><div class="stat"><b>${pd.new_reg??0}</b><span>신규 등록</span></div></div>` : `<div class="emptyline">마감 전에 입장객·문의·등록 숫자를 입력해 주세요</div>`}</div>`;
  if (facN) h += `<div class="card"><div class="card-head"><h2>시설 할 일</h2><button class="more" data-go="ops" data-ops="facility">시설 보기</button></div>
      <div class="statgrid s3">${fac.order?`<div class="stat"><b style="color:var(--bad)">${fac.order}</b><span>발주 필요</span></div>`:""}${fac.bad?`<div class="stat"><b style="color:var(--bad)">${fac.bad}</b><span>점검 이상</span></div>`:""}${fac.repairing?`<div class="stat"><b>${fac.repairing}</b><span>수리 중</span></div>`:""}${fac.checkDue?`<div class="stat"><b>${fac.checkDue}</b><span>해야 할 점검</span></div>`:""}${fac.cleanDue?`<div class="stat"><b>${fac.cleanDue}</b><span>해야 할 청소</span></div>`:""}</div></div>`;
  if (!vals("members").length) h += `<div class="card"><div class="emptyline">아직 등록된 회원이 없어요. + 버튼으로 첫 회원을 등록해 보세요.</div><button class="btn primary block" data-act="newMember">회원 등록</button></div>`;
  return h;
}

/* ================= 탭: 스케줄 ================= */
function viewSchedule(){
  const t = todayStr();
  let h = `<div class="pagehead"><div><div class="date">${esc(dLong(t))}</div><h1>스케줄</h1></div><button class="btn primary small" data-act="newLesson">+ 수업</button></div>
    ${segHtml(schedView, [["day","일별"],["week","주간 표"],["duty","당직표"]], "out")}`;
  if (schedView==="week") return h + weekGrid();
  if (schedView==="duty") return h + dutyView();
  const pred = l => inScopeL(l) && (!trFilter || lt(l)===trFilter);
  let days = "";
  for (let i=-3;i<21;i++){ const d = addDays(t,i), dd = parse(d), cnt = lessonsOn(d,pred).length;
    days += `<button class="day ${d===selDay?"on":""} ${dd.getDay()===0?"sun":""}" data-day="${d}"><span>${i===0?"오늘":WD[dd.getDay()]}</span><b>${dd.getDate()}</b><em>${cnt?cnt+"건":""}</em></button>`; }
  const ls = lessonsOn(selDay, pred), bl = blocksOn(selDay, scope==="mine"&&me?me.id:trFilter);
  const trChips = scope==="all" ? `<div class="chips"><button class="chip ${!trFilter?"on":""}" data-tr="">전체</button>${trainerList().map(tr=>`<button class="chip ${trFilter===tr.id?"on":""}" data-tr="${esc(tr.id)}">${esc(tr.name)}</button>`).join("")}</div>` : "";
  const items = ls.map(l=>({k:l.time,h:lessonRow(l)})).concat(bl.map(b=>({k:b.time,h:blockRow(b)}))).sort((a,b)=>a.k.localeCompare(b.k));
  return h + scopeChips() + trChips + `<div class="days" id="days">${days}</div>
    <div class="card"><div class="card-head"><h2>${esc(dLong(selDay))}</h2><span class="sub">PT ${ls.filter(l=>l.kind!=="ot").length} · OT ${ls.filter(l=>l.kind==="ot").length}</span></div>
    ${items.length ? `<div class="list">${items.map(x=>x.h).join("")}</div>` : `<div class="emptyline">이 날은 비어 있어요</div>`}
    <div class="actions"><button class="btn ghost small" data-act="newLesson">+ 수업</button><button class="btn ghost small" data-act="newBlock">+ 휴무·식사·홍보</button></div></div>`;
}
function weekGrid(){
  const tid = gridTrainer || (me && me.teaches!==false && me.id) || (trainerList()[0]||{}).id || "";
  const days = Array.from({length:7}, (_,i)=>addDays(weekOf,i)), t = todayStr();
  const ls = vals("lessons").filter(l => days.includes(l.date) && lt(l)===tid);
  const bs = vals("blocks").filter(b => days.includes(b.date) && b.trainer_id===tid);
  const hrs = []; let lo=7, hi=23; ls.concat(bs).forEach(x => { const hh=+x.time.slice(0,2); lo=Math.min(lo,hh); hi=Math.max(hi,hh); });
  for (let hh=lo; hh<=hi; hh++) hrs.push(pad(hh));
  const cell = (d,hh) => {
    const L = ls.filter(l=>l.date===d && l.time.slice(0,2)===hh).sort((a,b)=>a.time.localeCompare(b.time)), B = bs.filter(b=>b.date===d && b.time.slice(0,2)===hh);
    if (L.length){ const l=L[0]; const cls = l.status==="done"?"done":l.status==="noshow"?"ns":l.kind==="ot"?"ot":"pt";
      return `<td class="${cls}${l.cancel_req?" creq":""}" data-lesson="${esc(l.id)}"><b>${esc(clean(lname(l)).slice(0,4))}</b><i>${l.kind==="ot"?"OT":esc(sessionNo(l))}</i>${L.length>1?`<i> +${L.length-1}</i>`:""}</td>`; }
    if (B.length) return `<td class="blk${B[0].cancel_req?" creq":""}" data-block="${esc(B[0].id)}"><b>${esc(B[0].kind)}</b></td>`;
    return `<td data-slot="${d}|${hh}:00" aria-label="${dShort(d)} ${hh}시 비어 있음"></td>`;
  };
  const cnt = d => ls.filter(l=>l.date===d && l.kind!=="ot" && (l.status!=="noshow"||l.deduct!==false)).length;  /* OT는 세션 수에서 제외 */
  const wkTotal = ls.filter(l=>l.kind!=="ot" && (l.status!=="noshow"||l.deduct!==false)).length, wkOT = ls.filter(l=>l.kind==="ot").length;
  return `<div class="chips" ${tab==="admin"?"":"hidden"}>${trainerList().map(tr=>`<button class="chip ${tid===tr.id?"on":""}" data-gt="${esc(tr.id)}">${esc(tr.name)}</button>`).join("")}</div>
    <div class="card">
      <div class="card-head"><button class="btn ghost small" data-wk="${addDays(weekOf,-7)}" aria-label="이전 주">‹</button><h2 style="text-align:center">${dShort(days[0])} ~ ${dShort(days[6])}</h2><button class="btn ghost small" data-wk="${addDays(weekOf,7)}" aria-label="다음 주">›</button></div>
      <div class="kpis k3"><div class="kpi"><b>${wkTotal}</b><span>주간 총 세션</span></div><div class="kpi sun"><b>${wkOT}</b><span>주간 OT</span></div><div class="kpi good"><b>${ls.filter(l=>l.status==="done"&&l.kind!=="ot").length}</b><span>PT 완료</span></div></div>
      <div class="wk"><table class="grid"><thead><tr><th></th>${days.map(d=>`<th class="${d===t?"today":""}">${WD[parse(d).getDay()]}<br>${dShort(d)}</th>`).join("")}</tr></thead>
        <tbody>${hrs.map(hh=>`<tr><td class="tm">${hh}</td>${days.map(d=>cell(d,hh)).join("")}</tr>`).join("")}</tbody>
        <tfoot><tr><td class="tm" style="font-size:10px">세션</td>${days.map(d=>`<td>${cnt(d)}</td>`).join("")}</tr></tfoot></table></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>PT</span><span><i style="background:var(--sun)"></i>OT</span><span><i style="background:var(--ok)"></i>완료</span></div>
    </div>`;
}

/* ================= 탭: 회원 ================= */
let memTr = null;   /* 회원 탭: 트레이너별 보기 (null = 나, "all" = 전체) */
let memSeg = "list";
function viewMembers(){
  if (tab!=="admin" && memSeg==="sales") return `<div class="pagehead"><div><div class="date">${esc(me?me.name:"")} 담당</div><h1>회원</h1></div></div>${segHtml(memSeg, [["list","회원 목록"],["sales","내 매출"]], "out")}` + salesView();
  if (memTr===null) memTr = (me && me.id) || "all";
  const inTr = m => memTr==="all" ? true : memTr==="none" ? !m.trainer_id || !S.trainers[m.trainer_id] : m.trainer_id===memTr;
  const q = query.trim().replace(/-/g,"");
  const base = vals("members").filter(inTr);
  const unassigned = vals("members").filter(m => !m.trainer_id || !S.trainers[m.trainer_id]).length;
  const F = { active:m=>m.status!=="ended", care:m=>m.status!=="ended"&&needsCare(m), paused:m=>m.status==="paused", ended:m=>m.status==="ended", all:()=>true };
  const cnt = k => base.filter(F[k]).length;

  const tiers = [1,2,3].map(k => { const g = act.filter(m=>tier(m)===k); return {k, n:g.length, left:g.reduce((s,m)=>s+leftOf(m),0)}; });
  const ms = base.filter(F[mFilter]||F.active).filter(m => !tierF || (m.status!=="ended" && tier(m)===+tierF)).filter(m => !q || (m.name||"").includes(query.trim()) || (m.phone||"").replace(/-/g,"").includes(q)).sort((a,b)=>leftOf(a)-leftOf(b) || byName(a,b));

  let h = `<div class="pagehead"><div><div class="date">${memTr==="all"?"센터 전체":memTr==="none"?"담당 미지정":esc(tName(memTr))} 보유 회원</div><h1>회원</h1></div><button class="btn primary small" data-act="newMember">+ 등록</button></div>${tab==="admin"?"":segHtml(memSeg, [["list","회원 목록"],["sales","내 매출"]], "out")}
    <div class="chips" ${tab==="admin"?"":"hidden"}>${trainerList().map(tr=>`<button class="chip ${memTr===tr.id?"on":""}" data-memtr="${esc(tr.id)}">${esc(tr.name)}<span class="c">${vals("members").filter(m=>m.trainer_id===tr.id&&m.status!=="ended").length}</span></button>`).join("")}${unassigned?`<button class="chip ${memTr==="none"?"on":""}" data-memtr="none">담당 미지정<span class="c">${unassigned}</span></button>`:""}<button class="chip ${memTr==="all"?"on":""}" data-memtr="all">전체</button></div>
    <div class="pipe">${tiers.map(x=>`<button class="${tierF==x.k?"on":""}" data-tier="${x.k}"><b>${x.n}</b><span>${tierName(x.k)}</span><span class="num">잔여 ${x.left}</span></button>`).join("")}
      <button class="${!tierF?"on":""}" data-tier=""><b>${act.length}</b><span>합계</span><span class="num">잔여 ${tiers.reduce((s,x)=>s+x.left,0)}</span></button></div>
    <input class="search" id="q" type="search" placeholder="이름이나 전화번호 뒷자리로 찾기" value="${esc(query)}">
    <div class="chips">${chip("active","이용 중")}${chip("care","챙길 회원")}${chip("paused","홀딩")}${chip("ended","종료")}${chip("all","전체")}</div>`;
  if (!vals("members").length) return h + `<div class="card"><div class="emptyline">등록된 회원이 없어요</div><button class="btn primary block" data-act="newMember">회원 등록</button></div>`;
  return h + `<div class="card">${ms.length ? `<div class="list">${ms.map(memberRow).join("")}</div>` : `<div class="emptyline">조건에 맞는 회원이 없어요</div>`}</div>`;
}

/* ================= 탭: 홍보 ================= */
function viewPromo(){

  const t = todayStr(), mo = month(t), wks = promoWeeks(mo), cw = wks.find(w => t>=w.from && t<=w.to) || wks[wks.length-1], s = SET();
  const inW = d => d>=cw.from && d<=cw.to;
  const sum = (arr,k) => arr.reduce((a,p)=>a+(Number(p[k])||0),0);

  const inq = sum(pdW,"naver")+sum(pdW,"walkin")+sum(pdW,"phone"), aptW = vals("apt_promos").filter(a=>inW(a.date)).length, revW = vals("reviews").filter(r=>inW(r.date)).length;

    ${tab==="admin"?"":"<!--"}<div class="card"><div class="card-head"><h2>이번 주 목표</h2>${tab==="admin"?'<button class="more" data-aseg="settings">목표 수정</button>':""}</div>
      ${goalBar("문의 (네이버 예약·워크인·전화)", inq, s.inquiryGoal)}${goalBar("신규 등록", sum(pdW,"new_reg"), s.newRegGoal)}${goalBar("PT 신규", sum(pdW,"pt_new"), s.ptNewGoal)}
      ${goalBar("아파트 동·라인", aptW, s.aptGoal)}${goalBar("리뷰 작성", revW, s.reviewGoal)}</div>${tab==="admin"?"":"-->"}
    ${tab==="admin" || fcMode() ? "" : segHtml(promoSeg, [["inquiry","상담"],["apt","아파트"],["review","리뷰"]], "out")}`;
  if (promoSeg==="inquiry"){
    const all = vals("leads"), c = st => all.filter(d=>d.status===st).length;
    const F = { open:d=>d.status==="new"||d.status==="scheduled", new:d=>d.status==="new", scheduled:d=>d.status==="scheduled", registered:d=>d.status==="registered", lost:d=>d.status==="lost" };
    const list = all.filter(F[lFilter]||F.open).sort((a,b)=>((a.consult_on||"9999")+(a.consult_time||"")).localeCompare((b.consult_on||"9999")+(b.consult_time||"")));
    const monthLeads = all.filter(d => month((d.created_at||"").slice(0,10))===mo), conv = monthLeads.filter(d=>d.status==="registered").length;
    h += `<div class="pipe">${[["new","신규 문의"],["scheduled","상담 예정"],["registered","등록"],["lost","보류"]].map(([k,tx])=>`<button class="${lFilter===k?"on":""}" data-lf="${k}"><b>${c(k)}</b><span>${tx}</span></button>`).join("")}</div>
      <div class="card"><div class="card-head"><h2>${{open:"진행 중인 상담",new:"신규 문의",scheduled:"상담 예정",registered:"등록 완료",lost:"보류"}[lFilter]}</h2><button class="more" data-act="newLead">+ 상담 등록</button></div>
        ${list.length ? `<div class="list">${list.map(leadRow).join("")}</div>` : '<div class="emptyline">해당하는 상담이 없어요</div>'}
        <p class="note">이번 달 문의 ${monthLeads.length}건 중 ${conv}건 등록 · 전환율 ${pct(conv,monthLeads.length)}%</p></div>`;
  }
  if (promoSeg==="daily"){

    const T = k => rows.reduce((a,r)=>a+r[k],0);
    const recent = vals("promo_daily").filter(p=>month(p.id)===mo).sort((a,b)=>b.id.localeCompare(a.id));
    h += `<div class="card"><div class="card-head"><h2>${Number(mo.slice(5))}월 주간 현황</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>주차</th><th>입장</th><th>유입</th><th>문의</th><th>등록</th><th>PT</th><th>아파트</th><th>리뷰</th></tr></thead><tbody>
      ${rows.map(r=>`<tr ${r.w===cw?'style="background:var(--sun-soft)"':""}><td>${r.i}주</td><td>${r.vis}</td><td>${r.place}</td><td>${r.inq}</td><td>${r.reg}</td><td>${r.pt}</td><td>${r.apt}</td><td>${r.rev}</td></tr>`).join("")}
      <tr class="sum"><td>합계</td><td>${T("vis")}</td><td>${T("place")}</td><td>${T("inq")}</td><td>${T("reg")}</td><td>${T("pt")}</td><td>${T("apt")}</td><td>${T("rev")}</td></tr></tbody></table></div>
      <p class="note">등록률(신규 등록 ÷ 문의) ${pct(T("reg"),T("inq"))}%</p></div>
      <div class="card"><div class="card-head"><h2>일일 기록</h2><button class="more" data-act="daily">+ 오늘</button></div>
      ${recent.length?`<div class="list">${recent.map(p=>`<div class="row tap" data-daily="${esc(p.id)}"><div class="time" style="font-size:15px">${dShort(p.id)}</div><div class="grow"><div class="sub" style="color:var(--ink)">입장 ${p.visitors??0} · 유입 ${p.place??0} · 문의 ${(+p.naver||0)+(+p.walkin||0)+(+p.phone||0)} · 등록 ${p.new_reg??0}${p.pt_new?` (PT ${p.pt_new})`:""}</div>${p.memo?`<div class="sub">${esc(p.memo)}</div>`:""}</div></div>`).join("")}</div>`:'<div class="emptyline">이번 달 기록이 없어요</div>'}</div>`;
  }
  if (promoSeg==="apt"){
    const list = vals("apt_promos").filter(a=>month(a.date)===mo).sort((a,b)=>b.date.localeCompare(a.date));
    const by = {}; list.forEach(a => { const k=tName(a.trainer_id); by[k]=(by[k]||0)+1; });
    h += `<div class="card"><div class="card-head"><h2>아파트 홍보 · ${Number(mo.slice(5))}월 ${list.length}곳</h2><button class="more" data-act="newApt">+ 다녀옴</button></div>
      <div class="legend">${Object.entries(by).map(([k,v])=>`<span>${esc(k)} <b class="num">${v}</b></span>`).join("")}</div>
      ${list.length?`<div class="list">${list.map(a=>`<div class="row tap" data-apt="${esc(a.id)}"><div class="time" style="font-size:15px">${dShort(a.date)}</div><div class="grow"><div class="name">${esc(a.complex)} ${esc(dongTxt(a.dong))} ${esc(a.line&&a.line!=="전체"?(/라인/.test(a.line)?a.line:a.line+"라인"):"")}</div><div class="sub">${esc([tName(a.trainer_id), a.memo].filter(Boolean).join(" · "))}</div></div></div>`).join("")}</div>`:'<div class="emptyline">다녀온 곳만 한 줄씩 기록해요</div>'}</div>`;
    const seen = {}; list.forEach(a => { const k=[a.complex, aptNorm(a.dong), aptNorm(a.line)].join("|"); if (!seen[k] || a.date>seen[k]) seen[k]=a.date; });
    h += `<div class="card"><div class="card-head"><h2>단지별 현황 · ${Number(mo.slice(5))}월</h2></div>
      ${APTS.map(c => { const all = c.dongs.flatMap(([d,ls]) => ls.map(l => [d,l])); const done = all.filter(([d,l]) => seen[[c.name,d,l].join("|")]).length;
        return `<div class="aptc"><div class="aptc-h"><b>${esc(c.name)}</b><span class="sub">${c.homes}세대</span><span class="aptc-n${done===all.length?" full":""}">${done}/${all.length}</span></div>
          ${c.dongs.map(([d,ls]) => `<div class="aptd"><span class="aptd-l">${esc(dongTxt(d))}</span><div class="aptd-c">${ls.map(l => { const dt = seen[[c.name,d,l].join("|")];
            return `<button type="button" class="chip${dt?" on":""}" data-aptgo="${esc([c.name,d,l].join("|"))}">${esc(l==="전체"?"단지 전체":l+"라인")}${dt?`<span class="c">${Number(dt.slice(8))}일</span>`:""}</button>`; }).join("")}</div></div>`).join("")}</div>`; }).join("")}
      <p class="note">라인을 누르면 바로 기록할 수 있어요</p></div>`;

  if (promoSeg==="review"){
    const list = vals("reviews").filter(r=>month(r.date)===mo).sort((a,b)=>b.date.localeCompare(a.date));
    h += `<div class="card"><div class="card-head"><h2>리뷰 작성 · ${Number(mo.slice(5))}월 ${list.length}건</h2><button class="more" data-act="newReview">+ 리뷰</button></div>
      ${list.length?`<div class="list">${list.map(r=>`<div class="row tap" data-review="${esc(r.id)}"><div class="time" style="font-size:15px">${dShort(r.date)}</div><div class="grow"><div class="name">${esc(r.member_name||"-")}</div><div class="sub">${esc([tName(r.trainer_id), r.memo].filter(Boolean).join(" · "))}</div></div></div>`).join("")}</div>`:'<div class="emptyline">회원이 리뷰를 써주면 기록해요</div>'}</div>`;
  }

let sheetEntry = false, histReady = false, exitArmed = false;
function openSheet(html, mount){
  if (histReady && !sheetEntry){ history.pushState({sg:"sheet", tab}, ""); sheetEntry = true; }
  $("#layer").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sc = $("#scrim");
  sc.addEventListener("click", e => { if (e.target===sc || e.target.closest("[data-close]")) closeSheet(); });
  mount && mount(sc.querySelector(".sheet"));
}
function closeSheet(fromPop){
  $("#layer").innerHTML = "";
  if (fromPop){ sheetEntry = false; return; }
  setTimeout(() => { if (!$("#layer").innerHTML && sheetEntry){ sheetEntry = false; history.back(); } }, 0);
}
function initHistory(){
  if (histReady) return; histReady = true;
  history.replaceState({sg:"root"}, ""); history.pushState({sg:"app"}, "");
  if (tab!=="today") history.pushState({sg:"tab", tab}, "");
}
window.addEventListener("popstate", e => {
  if (!histReady) return;
  if (sheetEntry || $("#layer").innerHTML){ closeSheet(true); render(); return; }
  const st = e.state || {};
  if (st.sg==="root"){
    if (exitArmed){ history.back(); return; }
    exitArmed = true; toast("한 번 더 누르면 나가요"); history.pushState({sg:"app"}, ""); tab = "today"; store.set("sg_tab",tab); render();
    setTimeout(() => { exitArmed = false; }, 2000); return;
  }

  tab = st.sg==="tab" ? st.tab : "today"; store.set("sg_tab",tab); window.scrollTo(0,0); render();
});

function spark(bs){
  const W=320,H=56,P=4, xs = bs.map((b,i)=>P+i*(W-2*P)/(bs.length-1));
  const line = (k,col) => { const v=bs.map(b=>Number(b[k])).filter(x=>!isNaN(x)&&x); if (v.length<2) return ""; const mn=Math.min(...v), mx=Math.max(...v), r=mx-mn||1;
    const pts = bs.map((b,i)=>{ const x=Number(b[k]); return x ? `${xs[i].toFixed(1)},${(H-P-(x-mn)/r*(H-2*P)).toFixed(1)}` : null; }).filter(Boolean).join(" ");
    return `<polyline points="${pts}" style="fill:none;stroke:${col};stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round" vector-effect="non-scaling-stroke"/>`; };
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="체성분 변화 그래프">${line("weight","var(--accent)")}${line("muscle","var(--ok)")}${line("fat","var(--sun)")}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>체중</span><span><i style="background:var(--ok)"></i>골격근</span><span><i style="background:var(--sun)"></i>체지방</span><span>· 각자 범위 기준 추세</span></div>`;
}

function weekNumbers(from, to){
  const pays = vals("payments").filter(p=>p.paid_on>=from&&p.paid_on<=to), ls = vals("lessons").filter(l=>l.date>=from&&l.date<=to);
  const pd = vals("promo_daily").filter(p=>p.id>=from&&p.id<=to), sum = k => pd.reduce((a,p)=>a+(Number(p[k])||0),0);
  return `기간 ${dShort(from)}~${dShort(to)}\n· 매출 ${won(pays.reduce((a,p)=>a+(+p.amount||0),0))} (계약 ${pays.length}건)\n· 진행 수업 ${ls.filter(l=>l.status==="done").length}회 · 노쇼 ${ls.filter(l=>l.status==="noshow").length}회\n· 문의 ${sum("naver")+sum("walkin")+sum("phone")}건 · 신규 등록 ${sum("new_reg")}명 · PT 신규 ${sum("pt_new")}명\n· 아파트 홍보 ${vals("apt_promos").filter(a=>a.date>=from&&a.date<=to).length}곳 · 리뷰 ${vals("reviews").filter(r=>r.date>=from&&r.date<=to).length}건`;
}

    <form id="tf" class="form"><div class="field"><label for="t_name">이름</label><input id="t_name" required maxlength="20"></div>
      <div class="field"><label for="t_email">이메일</label><input id="t_email" type="email" required inputmode="email" placeholder="이 이메일로 가입하면 바로 쓸 수 있어요"></div>
      <div class="two"><div class="field"><label for="t_role">권한</label><select id="t_role" ${isOwner()?"":"disabled"}><option value="trainer">트레이너</option>${isOwner()?'<option value="admin">관리자</option>':""}</select></div><div class="field"><label for="t_tg">월 목표(원)</label><input id="t_tg" inputmode="numeric" value="7,000,000"></div></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="t_teach" checked> 수업함 (끄면 스케줄·담당·매출에서 빠져요)</label>
      <button class="btn primary block" type="submit">추가</button></form>`, s => {
    s.querySelector("#tf").addEventListener("submit", async e => { e.preventDefault();
      const email = s.querySelector("#t_email").value.trim().toLowerCase(), name = s.querySelector("#t_name").value.trim();
      if (vals("trainers").some(t => (t.email||"").toLowerCase()===email)){ toast("이미 등록된 이메일이에요"); return; }
      if (await safe(() => api.save("trainers", {name, email, role:isOwner()?s.querySelector("#t_role").value:"trainer", teaches:s.querySelector("#t_role").value==="fc" ? false : s.querySelector("#t_teach").checked, target:numOf(s.querySelector("#t_tg").value), commission:0}), "트레이너를 추가했어요")){
        closeSheet(); toast(`${name}님이 사이트에서 ${email}로 가입하면 바로 쓸 수 있어요`); } });

function accountSheet(){
  openSheet(`${head("내 계정")}
    <form id="acf" class="form"><div class="two"><div class="field"><label for="ac_n">이름</label><input id="ac_n" maxlength="20" value="${esc(me?me.name:"")}"></div>
      <div class="field"><label for="ac_t">호칭</label><input id="ac_t" list="ac_tl" maxlength="10" value="${esc(me?tTitle(me):"")}" placeholder="매니저, 트레이너, 팀장…"><datalist id="ac_tl">${["매니저","트레이너","팀장","실장","대표","코치"].map(x=>`<option value="${x}">`).join("")}</datalist></div></div>
      
      <button class="btn primary block" type="submit">저장</button></form>
    <dl class="kv"><div><dt>이메일</dt><dd>${esc(me?me.email:"-")}</dd></div><div><dt>권한</dt><dd>${isAdmin()?"관리자":"트레이너"}</dd></div></dl>
    ${isStandalone()?'':(installEvt||IS_IOS)?'<button class="btn ghost block" data-act="install">📲 앱으로 설치하기</button>':''}<button class="btn ghost block" data-act="logout">로그아웃</button>`, s => {
    s.addEventListener("click", e => { if (e.target.closest("[data-act='logout']")) logout(); if (e.target.closest("[data-act='install']")) { closeSheet(); doInstall(); } });

function addMenu(){
  const items = [["notice","전달사항","오늘 팀에 알릴 내용"],...(isAdmin()?[["meeting","회의록","주간 회의 내용·할 일"]]:[]),["lesson","수업 잡기","PT·OT 일정 (매주 반복 가능)"],["block","휴무·식사·홍보","스케줄 표에 일정 넣기"],["member","회원 등록","새 회원 + 첫 결제"],["lead","상담 등록","문의 들어온 예비 회원"],...(isAdmin()?[["daily","오늘 홍보 기록","입장객·유입·문의·등록"]]:[]),["apt","아파트 홍보","다녀온 단지·동·라인"],["repair","고장 접수","수리일지에 기록"]];

/* ================= 이벤트 ================= */
function go(t){
  if (t===tab){ window.scrollTo(0,0); render(); return; }
  if (histReady){
    if (t==="today"){ if (history.state && history.state.sg==="tab"){ history.back(); return; } }
    else if (tab==="today") history.pushState({sg:"tab", tab:t}, ""); else history.replaceState({sg:"tab", tab:t}, "");
  }
  if (t==="admin" && tab!=="admin"){ memTr="all"; trFilter=""; gridTrainer=""; }
  tab=t; store.set("sg_tab",tab); window.scrollTo(0,0); render();
}
document.querySelector("nav.tabs").addEventListener("click", e => { const b=e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });

  let x;
  if ((x=g("[data-quick]"))){ await quick(x.dataset.id, x.dataset.quick); return; }
  if ((x=g("[data-tdo]"))){ await taskDo(x.dataset.id, x.dataset.tdo); return; }
  if ((x=g("[data-qty]"))){ const s=S.supplies[x.dataset.id]; const q=Math.max(0,(Number(s.qty)||0)+Number(x.dataset.qty)); await safe(() => api.save("supplies", Object.assign({}, s, {qty:q}))); return; }
  if ((x=g("[data-scope]"))){ scope=x.dataset.scope; store.set("sg_scope",scope); if (scope==="mine") trFilter=""; render(); return; }

  if ((x=g("[data-day]"))){ selDay=x.dataset.day; render(); return; }
  if ((x=g("[data-wk]"))){ weekOf=x.dataset.wk; render(); return; }
  if ((x=g("[data-gt]"))){ gridTrainer=x.dataset.gt; render(); return; }

  if ((x=g("[data-tr]"))){ trFilter=x.dataset.tr; render(); return; }
  if ((x=g("[data-mf]"))){ mFilter=x.dataset.mf; render(); return; }
  if ((x=g("[data-tier]"))){ tierF=x.dataset.tier; render(); return; }
  if ((x=g("[data-lf]"))){ lFilter = lFilter===x.dataset.lf ? "open" : x.dataset.lf; render(); return; }
  if ((x=g("[data-mo]"))){ if (!x.disabled){ statMonth=x.dataset.mo; render(); } return; }
  if ((x=g("[data-fac]"))){ facSeg=x.dataset.fac; render(); return; }
  if ((x=g("[data-wkk]"))){ wkKind=x.dataset.wkk; render(); return; }
  if ((x=g("[data-memtr]"))){ memTr=x.dataset.memtr; tierF=""; render(); return; }
  if ((x=g("[data-go]"))){ if (x.dataset.filter) mFilter=x.dataset.filter; if (x.dataset.ops) opsSeg=x.dataset.ops; if (x.dataset.ops==="facility") facSeg="todo"; go(x.dataset.go); return; }
  if ((x=g("[data-trainer]"))){ trainerDetail(x.dataset.trainer); return; }
  if ((x=g("[data-member]"))){ memberDetail(x.dataset.member); return; }
  if ((x=g("[data-aseg]"))){ if (!isAdmin()) return; adminSeg=x.dataset.aseg; trFilter=""; if (adminSeg==="members"){ memTr="all"; if (x.dataset.filter) mFilter=x.dataset.filter; } if (adminSeg==="schedule") gridTrainer=""; if (tab!=="admin"){ const keep=memTr; go("admin"); if (adminSeg==="members"){ memTr=keep; render(); } } else { window.scrollTo(0,0); render(); } return; }
  if ((x=g("[data-dmo]"))){ dutyMonth=x.dataset.dmo; rosterScroll=null; render(); return; }
  if ((x=g("[data-gym]"))){ gymDetail(x.dataset.gym); return; }
  if ((x=g("[data-gmf]"))){ gmFilter = x.dataset.gmf; render(); return; }
  if ((x=g("[data-fmo]"))){ fcMonth = x.dataset.fmo; render(); return; }
  if ((x=g("[data-fct]"))){ fcTr = x.dataset.fct; render(); return; }
  if ((x=g("[data-rc]"))){ rosterPaint(x); return; }
  if ((x=g("[data-rcode]"))){ rosterCode = x.dataset.rcode; document.querySelectorAll("[data-rcode]").forEach(b => b.classList.toggle("on", b===x)); return; }
  if ((x=g("[data-rrow]"))){ rosterRowForm(x.dataset.rrow); return; }
  if ((x=g("[data-sched]"))){ schedView=x.dataset.sched; store.set("sg_sched",schedView); go("schedule"); return; }
  if ((x=g("[data-xcancel]"))){ cancelSheet(x.dataset.xcancel); return; }
  if ((x=g("[data-creq]"))){ await decideCancel(x.dataset.ct, x.dataset.cid, x.dataset.creq==="ok"); return; }
  if ((x=g("[data-lesson]"))){ lessonDetail(x.dataset.lesson); return; }
  if ((x=g("[data-block]"))){ blockForm(S.blocks[x.dataset.block]); return; }
  if ((x=g("[data-lead]"))){ leadDetail(x.dataset.lead); return; }
  if ((x=g("[data-deal]"))){ dealForm(S.deals[x.dataset.deal]); return; }
  if ((x=g("[data-daily]"))){ dailyForm(x.dataset.daily); return; }
  if ((x=g("[data-aptgo]"))){ const [complex,dong,line] = x.dataset.aptgo.split("|"); aptForm(null, {complex, dong, line}); return; }
  if ((x=g("[data-apt]"))){ aptForm(S.apt_promos[x.dataset.apt]); return; }
  if ((x=g("[data-review]"))){ reviewForm(S.reviews[x.dataset.review]); return; }
  if ((x=g("[data-task]"))){ taskForm(S.fac_tasks[x.dataset.task]); return; }
  if ((x=g("[data-repair]"))){ repairForm(S.repairs[x.dataset.repair]); return; }
  if ((x=g("[data-supply]"))){ supplyForm(S.supplies[x.dataset.supply]); return; }
  if ((x=g("[data-read]"))){ await markRead(x.dataset.read); return; }
  if ((x=g("[data-aitem]"))){ await toggleAction(x.dataset.aitem); return; }
  if ((x=g("[data-notice]"))){ noticeForm(S.notices[x.dataset.notice]); return; }
  if ((x=g("[data-meeting]"))){ const mg=S.meetings[x.dataset.meeting]; if (mg) (isAdmin()?meetingForm:meetingRead)(mg); return; }
  if (!(x=g("[data-act]"))) return;
  ({ newLesson:()=>lessonForm(), newBlock:()=>blockForm(), newMember:()=>memberForm(), newLead:()=>leadForm(), newTrainer:()=>trainerForm(), newDeal:()=>dealForm(),
     daily:()=>dailyForm(), newNotice:()=>noticeForm(), gymNew:()=>gymForm(), rosterMake:()=>{ rosterSave(dutyMonth, rosterNew(dutyMonth), true); rosterEdit = true; render(); }, rosterEdit:()=>{ rosterEdit = !rosterEdit; render(); }, rosterFill:()=>rosterFill(), rosterRow:()=>rosterRowForm(null), rosterNote:()=>rosterNoteForm(), rosterAsk:()=>rosterAsk(), newMeeting:()=>{ if (isAdmin()) meetingForm(); else toast("회의록은 관리자만 쓸 수 있어요"); }, meetAll:()=>meetingAll(), newApt:()=>aptForm(), newReview:()=>reviewForm(), newTask:()=>taskForm(), newRepair:()=>repairForm(), newSupply:()=>supplyForm(), loadPreset,
     copyOrder:()=>copy(`[${SET().gymName}] 발주 필요 목록\n`+vals("supplies").filter(s=>supplyState(s).k==="order").map(s=>`- ${s.name} (현재 ${s.qty}${s.unit||""} / 최소 ${s.min_qty}${s.unit||""})${s.vendor?" · "+s.vendor:""}`).join("\n")) }[x.dataset.act] || (()=>{}))();
});
$("#view").addEventListener("input", e => { if (e.target.id==="q"){ query=e.target.value; render(); } if (e.target.id==="gq"){ gmQuery=e.target.value; render(); const q=$("#gq"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } } });
$("#fab").addEventListener("click", () => {
  if (fcMode()){ if (tab==="promo") return leadForm(); if (tab==="ops") return repairForm(); return gymForm(); }
  if (tab==="members") return memSeg==="sales" ? dealForm() : memberForm();
  if (tab==="schedule") return lessonForm();

  if (tab==="admin" && adminSeg==="staff") return trainerForm();

});
$("#avatarBtn").addEventListener("click", accountSheet);
false && document.body.addEventListener("click", e => { const b = e.target.closest("[data-vmode]"); if (!b || !isAdmin()) return; if ((fcMode()?"fc":"pt")===b.dataset.vmode) return;
  viewMode = b.dataset.vmode; store.set("sg_mode", viewMode); tab = "today"; store.set("sg_tab", tab); window.scrollTo(0,0); render(); toast(viewMode==="fc" ? "FC 화면으로 바꿨어요" : "PT 화면으로 바꿨어요"); });
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur==="dark" ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("sg_theme", next);
});
(() => { const t = store.get("sg_theme"); document.documentElement.dataset.theme = t || "light"; })();
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSheet(); });

/* ================= 로그인 ================= */
let mode = "login";
$("#authForm").addEventListener("click", e => {
  const c = e.target.closest("[data-mode]"); if (!c) return;
  mode = c.dataset.mode; document.querySelectorAll("[data-mode]").forEach(x => x.classList.toggle("on", x===c));
  $("#nameField").hidden = mode!=="signup"; $("#authBtn").textContent = mode==="signup" ? "가입하기" : "로그인";
  $("#a_pw").autocomplete = mode==="signup" ? "new-password" : "current-password"; $("#authErr").textContent = "";
});
$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#a_email").value.trim(), password = $("#a_pw").value, btn = $("#authBtn");
  if (!sb){ $("#authErr").textContent = "로그인 기능을 불러오지 못했어요. 새로고침해 주세요."; return; }
  btn.disabled = true; $("#authErr").textContent = "";
  try {
    const res = mode==="signup" ? await sb.auth.signUp({ email, password, options:{ data:{ name:$("#a_name").value.trim() } } }) : await sb.auth.signInWithPassword({ email, password });
    if (res.error) throw res.error;
    if (mode==="signup" && !res.data.session) $("#authErr").textContent = "가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.";
  } catch(err){
    const msg = (err && err.message) || "";
    $("#authErr").textContent = /Invalid login/i.test(msg) ? "이메일이나 비밀번호가 맞지 않아요." : /already registered/i.test(msg) ? "이미 가입된 이메일이에요. 로그인해 주세요."
      : /Email not confirmed/i.test(msg) ? "이메일 인증이 아직 안 됐어요. 받은 메일의 링크를 눌러 주세요." : /Password/i.test(msg) ? "비밀번호는 6자 이상으로 해 주세요." : "로그인하지 못했어요. 잠시 후 다시 해 주세요.";
  } finally { btn.disabled = false; }
});
async function logout(){ closeSheet(); if (sb) await sb.auth.signOut(); else toast("미리보기 모드에서는 로그아웃이 없어요"); }
$("#logout2").addEventListener("click", logout);
$("#recheck").addEventListener("click", () => enter());

/* ================= 앱 설치 (PWA) ================= */
let installEvt = null;
function isStandalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints > 1);
function showInstallBar(){ const b = $("#installBar"); if (b) b.hidden = !((installEvt || IS_IOS) && !isStandalone() && store.get("sg_install_x") !== "1"); }
function iosGuide(){
  const ib = $("#installBar"); if (ib) ib.hidden = true;
  const inApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent), pad = /iPad/.test(navigator.userAgent) || navigator.platform==="MacIntel";
  const st = (n,t) => `<div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;display:flex;align-items:center;justify-content:center">${n}</span><div style="line-height:1.55;padding-top:2px">${t}</div></div>`;
  openSheet(`${head("홈 화면에 추가하기")}
    ${inApp?`<div class="confirm" style="margin-bottom:6px">지금은 앱 안 브라우저예요. 오른쪽 아래(또는 위) 메뉴에서 <b>사파리로 열기</b>를 누른 뒤 다시 따라 해 주세요.</div>`:""}
    ${st(1, `사파리 ${pad?"주소창 오른쪽 위":"화면 맨 아래 가운데"}의 <b>공유 버튼</b> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> 을 눌러요<br><span class="sub">안 보이면 주소창 옆 <b>⋯</b> → 공유</span>`)}
    ${st(2, `메뉴를 내려서 <b>홈 화면에 추가</b>를 눌러요`)}
    ${st(3, `오른쪽 위 <b>추가</b>를 누르면 끝이에요`)}
    <button class="btn primary block" data-close>확인</button>`);
}
async function doInstall(){
  if (!installEvt){ if (IS_IOS){ iosGuide(); return; } toast('크롬 메뉴(⋮) → "앱 설치"를 눌러 주세요'); return; }
  installEvt.prompt(); try { const r = await installEvt.userChoice; if (r && r.outcome === "accepted") toast("앱을 설치했어요. 홈 화면을 확인해 주세요"); } catch(e){}
  installEvt = null; showInstallBar();
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; showInstallBar(); });
showInstallBar(); if (IS_IOS){ const t=$("#installGo"); if (t) t.textContent="방법"; }
window.addEventListener("appinstalled", () => { installEvt = null; showInstallBar(); });
$("#installGo").addEventListener("click", doInstall);
$("#installX").addEventListener("click", () => { store.set("sg_install_x","1"); showInstallBar(); toast("나중에 내 계정(오른쪽 위)에서 설치할 수 있어요"); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }

/* ================= 시작 ================= */
let channel = null, reloadTimer = null;
async function enter(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ show("authView"); return; }
  const email = (session.user.email||"").toLowerCase();
  try { await api.loadAll(); } catch(e){ console.error(e); toast("데이터를 불러오지 못했어요. 새로고침해 주세요."); }
  me = vals("trainers").find(t => (t.email||"").toLowerCase()===email) || null;
  if (!me){ $("#pendingEmail").textContent = email; show("pendingView"); return; }
  if (me.teaches===false && me.role==="admin" && tab==="today") tab = "admin";
  show("appView"); initHistory(); render();
  if (!channel){
    channel = sb.channel("skygym-live").on("postgres_changes", { event:"*", schema:"public" }, () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(async () => { try { await api.loadAll(); if (!$("#layer").innerHTML) render(); } catch(e){} }, 500); }).subscribe();
  }
}
if (DEMO){ seedDemo(); show("appView"); initHistory(); render(); }
else if (LIBFAIL){ show("authView"); $("#authErr").textContent = "로그인 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."; }
else {
  sb.auth.onAuthStateChange(ev => {
    if (ev==="SIGNED_OUT"){ if (channel){ sb.removeChannel(channel); channel=null; } TABLES.forEach(t=>S[t]={}); me=null; show("authView"); return; }
    if (ev==="SIGNED_IN" || ev==="INITIAL_SESSION") setTimeout(enter, 0);
  });
}
document.addEventListener("visibilitychange", async () => { if (!DEMO && !document.hidden && me){ try { await api.loadAll(); if (!$("#layer").innerHTML) render(); } catch(e){} } });
})();
</script>

<style>
/* Layout: phone-first single column. Dawn sky: pale sky blue fading to sunrise peach. Round counters, wave ring, floating pill tab bar. */
:root{
  --sky:#D7E8F6; --dawn:#FBE6D6; --bg:#F7F8FA;
  --surface:#FFFFFF; --surface-2:#F1F4F8; --ink:#16233A; --muted:#66738A; --line:#E3E8EF;
  --accent:#2B5C9E; --accent-ink:#FFFFFF; --accent-soft:#E2ECF8;
  --sun:#F2B48C; --sun-soft:#FCE9DC; --sun-ink:#9A4E22;
  --ok:#2E7D5B; --ok-soft:#DFF1E8; --warn:#B26B12; --warn-soft:#F8EAD3; --bad:#C2412D; --bad-soft:#F9E1DC;
  --shadow:0 8px 24px rgba(22,35,58,.08);
  --font-num:"Barlow","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#16223A; --dawn:#2A1E2A; --bg:#0F1422;
  --surface:#1A2234; --surface-2:#222C40; --ink:#E7ECF4; --muted:#97A3B8; --line:#2A354B;
  --accent:#8DB6EC; --accent-ink:#0F1422; --accent-soft:#22324C;
  --sun:#E59A70; --sun-soft:#3A2722; --sun-ink:#F4C1A1;
  --ok:#6CCB9E; --ok-soft:#18322A; --warn:#E5AE5C; --warn-soft:#352813; --bad:#F08A76; --bad-soft:#3A1C16;
  --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#16223A; --dawn:#2A1E2A; --bg:#0F1422;
  --surface:#1A2234; --surface-2:#222C40; --ink:#E7ECF4; --muted:#97A3B8; --line:#2A354B;
  --accent:#8DB6EC; --accent-ink:#0F1422; --accent-soft:#22324C;
  --sun:#E59A70; --sun-soft:#3A2722; --sun-ink:#F4C1A1;
  --ok:#6CCB9E; --ok-soft:#18322A; --warn:#E5AE5C; --warn-soft:#352813; --bad:#F08A76; --bad-soft:#3A1C16;
  --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.skybg{background:linear-gradient(180deg,var(--sky) 0%,var(--dawn) 340px,var(--bg) 620px) no-repeat}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 140px;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:10px}
.circle-btn{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--surface) 70%,transparent);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.circle-btn svg{width:22px;height:22px}
.brand{flex:1;text-align:center;font-family:var(--font-num);font-weight:600;letter-spacing:.22em;font-size:13px;color:var(--accent)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--sun-soft);color:var(--sun-ink);display:grid;place-items:center;font-weight:600;font-size:17px;flex:none}

/* round counters */
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cnt{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.cnt .disc{width:min(72px,19vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:color-mix(in srgb,var(--surface) 75%,transparent);box-shadow:var(--shadow);display:grid;place-items:center;font-family:var(--font-num);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink)}
.cnt.alert .disc{color:var(--bad)}
.cnt.good .disc{color:var(--ok)}
.cnt span{font-size:13px;color:var(--ink);white-space:nowrap}

/* greeting */
.hello{text-align:center;display:flex;flex-direction:column;gap:6px}
.hello h1{margin:0;font-size:28px;line-height:1.35;font-weight:400;letter-spacing:-.01em;text-wrap:balance}
.hello .date{font-size:15px;color:var(--muted)}

/* wave ring */
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.ringwrap .lbl{font-size:15px;color:var(--muted);letter-spacing:.04em}
.ring{width:min(240px,64vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--surface);box-shadow:0 18px 50px rgba(43,92,158,.12),inset 0 0 0 1px var(--line);position:relative;overflow:hidden;display:grid;place-items:center}
.ring .fill{position:absolute;left:-25%;width:150%;bottom:0;transition:height .9s ease}
.ring .fill svg{position:absolute;top:-18px;left:0;width:100%;height:20px}
.ring .fill .body{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--sun-soft)}
.ring .fill svg path{fill:var(--sun-soft)}
.ring .num{position:relative;text-align:center}
.ring .num b{font-family:var(--font-num);font-weight:300;font-size:min(76px,20vw);line-height:1;font-variant-numeric:tabular-nums}
.ring .num b small{font-size:.42em;font-weight:400}
.ring .num div{font-size:14px;color:var(--ink);margin-top:6px}
@media (prefers-reduced-motion:no-preference){.ring .fill svg{animation:drift 6s linear infinite}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-33.33%)}}}

/* cards & lists */
.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:center;gap:12px}
.card-head h2{margin:0;font-size:17px;font-weight:600;flex:1}
.plus{width:44px;height:44px;border-radius:50%;background:var(--sun-soft);color:var(--sun-ink);display:grid;place-items:center;flex:none}
.plus svg{width:20px;height:20px}
.sec{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);min-width:0}
.list .row:first-child{border-top:0}
.row.tap{cursor:pointer;border-radius:12px}
.row.tap:active{background:var(--surface-2)}
.time{font-family:var(--font-num);font-size:20px;font-weight:500;width:56px;flex:none;font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.left{font-family:var(--font-num);font-weight:500;font-size:24px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.left small{font-size:14px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--sun))}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.hot{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.sun{background:var(--sun-soft);color:var(--sun-ink)}
.emptyline{color:var(--muted);font-size:15px;padding:4px 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:999px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.outline{border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent);background:transparent}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.block{width:100%;padding:16px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.hint{text-align:center;font-size:14px;color:var(--muted);margin:0}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--surface) 80%,transparent);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.seg button{padding:12px;border-radius:999px;font-weight:500;color:var(--muted)}
.seg button.on{background:linear-gradient(90deg,var(--sun-soft),color-mix(in srgb,var(--sun) 35%,var(--sun-soft)));color:var(--ink);font-weight:600}
.pagehead{display:flex;flex-direction:column;gap:2px}
.pagehead h1{margin:0;font-size:24px;font-weight:600}
.pagehead .date{font-size:13px;color:var(--muted)}

/* schedule */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;padding:10px 0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px}
.day span{font-size:12px;color:var(--muted)}
.day b{font-family:var(--font-num);font-size:21px;font-weight:500;line-height:1}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--sun)}
.day.on{background:var(--accent);color:var(--accent-ink)}
.day.on span{color:var(--accent-ink);opacity:.8}
.search{width:100%;padding:14px 18px;border-radius:999px;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font:inherit}

/* trainers */
.tgrid{display:grid;grid-template-columns:1fr;gap:12px}
.tcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;width:100%}
.tcard .who{display:flex;align-items:center;gap:12px}
.tcard .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tstats div{background:var(--surface-2);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column}
.tstats b{font-family:var(--font-num);font-size:22px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.tstats span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink)}

/* tab bar */
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}
.dock .in{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
nav.tabs{flex:1;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:999px;box-shadow:0 10px 30px rgba(22,35,58,.14);padding:8px 6px;pointer-events:auto}
nav.tabs button{padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] svg{color:var(--sun)}
.fab{width:64px;height:64px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(22,35,58,.14);pointer-events:auto;position:relative;flex:none}
.fab svg{width:28px;height:28px}
.fab .spark{position:absolute;top:11px;right:11px;width:14px;height:14px;color:var(--sun)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,20,34,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h3{margin:0;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big b{font-family:var(--font-num);font-size:54px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted)}
.kv{display:flex;flex-direction:column;gap:7px;font-size:14px;margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .h{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.hist .h .d{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.banner{background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:16px;padding:10px 14px;font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
h2.t{margin:0;font-size:16px;font-weight:600}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column}
.auth .hero{padding:calc(64px + env(safe-area-inset-top,0px)) 24px 36px;max-width:440px;margin:0 auto;width:100%;text-align:center}
.auth .hero .brand{font-size:15px;display:block}
.auth .hero h1{margin:14px 0 0;font-size:28px;font-weight:400;line-height:1.35}
.auth .card{border-radius:30px 30px 0 0;flex:1;padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px));max-width:520px;width:100%;margin:0 auto}
.auth form{display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-size:13px;min-height:1em;margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<!-- 로그인 -->
<section class="auth skybg" id="authView" hidden>

<script>
(function(){
"use strict";
/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const WD = ["일","월","화","수","목","금","토"], WDL = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
const todayStr = () => ymd(new Date());
const addDays = (s,n) => { const [y,m,d]=s.split("-").map(Number); return ymd(new Date(y,m-1,d+n)); };
const dLabel = s => { const [y,m,d]=s.split("-").map(Number); return m+"월 "+d+"일 ("+WD[new Date(y,m-1,d).getDay()]+")"; };
const dLong = s => { const [y,m,d]=s.split("-").map(Number); return m+"월 "+d+"일 "+WDL[new Date(y,m-1,d).getDay()]; };
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function show(id){ ["authView","pendingView","appView"].forEach(v => $("#"+v).hidden = v!==id); }
const initial = n => (n||"?").trim().charAt(0);

/* ================= 상태 ================= */
const S = { members:{}, lessons:{}, trainers:{} };
let me = null;
let tab = store.get("sg_tab") || "today", selDay = todayStr(), query = "", scope = store.get("sg_scope") || "mine";

/* ================= 데이터 계층 ================= */
const CFG = window.SKYGYM_CONFIG || {};
const DEMO = !CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY;
const LIBFAIL = !DEMO && !window.supabase;
const sb = (DEMO || LIBFAIL) ? null : window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
async function fetchAll(table){
  const out = []; let from = 0; const size = 1000;
  for(;;){ const { data, error } = await sb.from(table).select("*").range(from, from+size-1); if (error) throw error; out.push(...data); if (data.length < size) break; from += size; }
  return out;
}
const toMap = rows => { const m = {}; rows.forEach(r => m[r.id] = r); return m; };
const api = {
  async loadAll(){ if (DEMO) return; const [t,m,l] = await Promise.all([fetchAll("trainers"),fetchAll("members"),fetchAll("lessons")]); S.trainers=toMap(t); S.members=toMap(m); S.lessons=toMap(l); },
  async save(table, row){
    row = Object.assign({}, row); if (!row.id) row.id = uid();
    if (!DEMO){ const { data, error } = await sb.from(table).upsert(row).select().single(); if (error) throw error; row = data; }
    S[table][row.id] = row; return row;
  },
  async remove(table, id){
    if (!DEMO){ const { error } = await sb.from(table).delete().eq("id", id); if (error) throw error; }
    delete S[table][id];
    if (table==="members") Object.values(S.lessons).forEach(l => { if (l.member_id===id) delete S.lessons[l.id]; });
    if (table==="trainers") Object.values(S.members).forEach(m => { if (m.trainer_id===id) m.trainer_id = null; });
  }
};
async function safe(fn, okMsg){
  try { const r = await fn(); render(); if (okMsg) toast(okMsg); return r || true; }
  catch(e){ console.error(e); toast(/JWT|auth/i.test((e&&e.message)||"") ? "로그인이 만료됐어요. 다시 로그인해 주세요." : "저장하지 못했어요. 인터넷 연결을 확인해 주세요."); return false; }
}

    ["m4","정하람","벌크업","",20,"t2",-3],["m5","오세린","산후 체력 회복","허리 조심",10,"t3",-15],["m6","강태오","골프 비거리","",20,"t1",-5]];
  S.members = {}; M.forEach(([id,name,goal,memo,total,tr,off]) => S.members[id] = {id,name:name+" (예시)",phone:"010-0000-"+pad(Math.abs(off))+"00",goal,memo,total,trainer_id:tr,created_at:addDays(t,off)});

    ["l4","m1",0,"20:00","booked",""],["l5","m6",0,"07:00","done","드라이버 회전 가동성, 케이블 우드찹"],["l6","m2",0,"19:00","booked",""],["l7","m6",0,"21:00","booked",""],
    ["l8","m3",0,"10:00","done","힙쓰러스트 40kg"],["l9","m4",0,"18:00","booked",""],["l10","m5",0,"11:00","booked",""],["l11","m3",2,"10:00","booked",""],["l12","m5",-1,"11:00","done","코어 안정화"],
    ...Array.from({length:7},(_,i)=>["d"+i,"m2",-30+i*3,"19:00","done","상체 루틴"]), ...Array.from({length:17},(_,i)=>["e"+i,"m5",-60+i*3,"11:00","done","코어·하체"])];
  S.lessons = {}; L.forEach(([id,mid,off,time,status,note]) => S.lessons[id] = {id,member_id:mid,date:addDays(t,off),time,status,note});

/* ================= 계산 ================= */
const usedOf = mid => Object.values(S.lessons).filter(l => l.member_id===mid && l.status==="done").length;
const leftOf = m => Math.max(0, (m.total||0) - usedOf(m.id));
const visibleM = m => scope!=="mine" || !me || m.trainer_id===me.id;
const byName = (a,b) => (a.name||"").localeCompare(b.name||"","ko");
const memberList = () => Object.values(S.members).filter(visibleM).sort(byName);
const allMembers = () => Object.values(S.members).sort(byName);
const lessonsOn = (day, filt) => Object.values(S.lessons).filter(l => { const m=S.members[l.member_id]; return l.date===day && (filt ? filt(m) : (!m || visibleM(m))); }).sort((a,b)=>a.time.localeCompare(b.time));
const trainerList = () => Object.values(S.trainers).sort((a,b) => (b.role==="admin")-(a.role==="admin") || byName(a,b));
const tName = id => !id ? "담당 미지정" : (S.trainers[id] ? S.trainers[id].name + (me && id===me.id ? " (나)" : "") : "퇴사한 트레이너");
const isAdmin = () => !!(me && me.role==="admin");
const ofTrainer = tid => m => m && m.trainer_id===tid;

/* ================= 화면 조각 ================= */
function lessonRow(l){
  const m = S.members[l.member_id];
  const st = l.status==="done" ? '<span class="pill ok">완료</span>' : '<span class="pill sun">예정</span>';
  const sub = [scope!=="mine" && m ? tName(m.trainer_id) : "", l.note || (m && m.goal) || ""].filter(Boolean).join(" · ");
  return `<div class="row tap" data-lesson="${esc(l.id)}"><div class="time">${esc(l.time)}</div>
    <div class="grow"><div class="name">${esc(m?m.name:"삭제된 회원")}</div><div class="sub">${esc(sub)}</div></div>${st}</div>`;
}
function memberRow(m, showT){
  const left = leftOf(m), total = m.total||0, used = total-left;
  const pill = left===0 ? '<span class="pill bad">재등록</span>' : left<=3 ? `<span class="pill warn">${left}회 남음</span>` : "";
  const sub = [(showT ?? scope!=="mine") ? tName(m.trainer_id) : "", m.goal || "목표 미입력"].filter(Boolean).join(" · ");
  return `<div class="row tap" data-member="${esc(m.id)}">
    <div class="grow"><div class="name">${esc(m.name)}</div><div class="sub">${esc(sub)}</div><div class="meter"><i style="width:${total?Math.round(used/total*100):0}%"></i></div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><div class="left">${left}<small>/${total}</small></div>${pill}</div></div>`;
}
function scopeSeg(){
  return `<div class="seg" role="group" aria-label="보기 범위"><button class="${scope==="mine"?"on":""}" data-scope="mine">내 회원</button><button class="${scope!=="mine"?"on":""}" data-scope="all">센터 전체</button></div>`;
}
function waveRing(pct, line){
  const h = Math.max(0, Math.min(100, pct));
  const wave = "M0 12 Q 25 0 50 12 T 100 12 T 150 12 T 200 12 T 250 12 T 300 12 V20 H0Z";
  return `<div class="ring" role="img" aria-label="${esc(line)}">
    <div class="fill" style="height:${h}%">${h>0&&h<100?`<svg viewBox="0 0 300 20" preserveAspectRatio="none" style="width:300%"><path d="${wave}"/></svg>`:""}<div class="body"></div></div>
    <div class="num"><b>${Math.round(h)}<small>%</small></b><div>${esc(line)}</div></div></div>`;
}
function pageHead(title){ return `<div class="pagehead"><div class="date">${esc(dLong(todayStr()))}</div><h1>${esc(title)}</h1></div>`; }

/* ================= 탭 화면 ================= */
function viewToday(){
  const t = todayStr(), today = lessonsOn(t), ms = memberList();
  const done = today.filter(l => l.status==="done").length;
  const pct = today.length ? done/today.length*100 : 0;
  const low = ms.filter(m => leftOf(m)<=3);
  const newWeek = ms.filter(m => m.created_at && m.created_at > addDays(t,-7)).length;
  const title = me ? (me.role==="admin" ? `${me.name} 대표님` : `${me.name} 트레이너님`) : "트레이너님";
  let h = `<div class="counters">
      <div class="cnt"><div class="disc">${today.length}</div><span>오늘 수업</span></div>
      <div class="cnt ${today.length-done?"":"good"}"><div class="disc">${today.length-done}</div><span>남은 수업</span></div>
      <div class="cnt ${low.length?"alert":""}"><div class="disc">${low.length}</div><span>재등록</span></div>
      <div class="cnt"><div class="disc">${newWeek}</div><span>신규 회원</span></div></div>
    <div class="hello"><h1>안녕하세요,<br>${esc(title)}</h1><div class="date">${esc(dLong(t))}</div></div>
    ${scopeSeg()}
    <div class="ringwrap"><div class="lbl">오늘 마무리</div>${waveRing(pct, today.length ? `수업 ${today.length}개 중 ${done}개 끝` : "오늘 잡힌 수업이 없어요")}</div>
    <div class="card"><div class="card-head"><button class="plus" data-act="newLesson" aria-label="수업 잡기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><h2>오늘 일정</h2></div>
      ${today.length ? `<div class="list">${today.map(lessonRow).join("")}</div>` : `<div class="emptyline">오늘 잡힌 수업이 없어요</div><button class="btn outline block" data-act="newLesson">수업 잡기</button>`}</div>`;
  if (low.length) h += `<div class="card"><div class="card-head"><h2>재등록 챙길 회원</h2><span class="pill bad">${low.length}명</span></div><div class="list">${low.map(m=>memberRow(m)).join("")}</div></div>`;
  if (!Object.keys(S.members).length) h += `<div class="card"><div class="emptyline">아직 등록된 회원이 없어요. 첫 회원을 등록하면 남은 세션이 자동으로 계산돼요.</div><button class="btn primary block" data-act="newMember">회원 등록</button></div>`;
  return h;
}
function viewSchedule(){
  const t = todayStr(); let days = "";
  for (let i=-1;i<20;i++){
    const d = addDays(t,i), [y,m,dd] = d.split("-").map(Number);
    days += `<button class="day ${d===selDay?"on":""} ${lessonsOn(d).length?"has":""}" data-day="${d}"><span>${i===0?"오늘":WD[new Date(y,m-1,dd).getDay()]}</span><b>${dd}</b><i></i></button>`;
  }
  const ls = lessonsOn(selDay);
  return pageHead("스케줄") + scopeSeg() + `<div class="days">${days}</div>
    <div class="card"><div class="card-head"><button class="plus" data-act="newLesson" aria-label="수업 잡기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><h2>${esc(dLabel(selDay))}</h2><span class="sub">${ls.length}개</span></div>
    ${ls.length ? `<div class="list">${ls.map(lessonRow).join("")}</div>` : `<div class="emptyline">이 날은 비어 있어요</div>`}</div>`;
}
function viewMembers(){
  const q = query.trim();
  const ms = memberList().filter(m => !q || (m.name||"").includes(q) || (m.phone||"").replace(/-/g,"").includes(q.replace(/-/g,"")));
  let h = pageHead("회원") + scopeSeg() + `<input class="search" id="q" type="search" placeholder="이름이나 전화번호로 찾기" value="${esc(query)}">`;
  if (!Object.keys(S.members).length) return h + `<div class="card"><div class="emptyline">등록된 회원이 없어요</div><button class="btn primary block" data-act="newMember">회원 등록</button></div>`;
  return h + `<div class="card">${ms.length ? `<div class="list">${ms.map(m=>memberRow(m)).join("")}</div>` : `<div class="emptyline">찾는 회원이 없어요</div>`}</div>`;
}
function trainerStats(tid){
  const t = todayStr(), mine = Object.values(S.members).filter(m => m.trainer_id===tid);
  const tl = lessonsOn(t, ofTrainer(tid));
  const month = Object.values(S.lessons).filter(l => l.status==="done" && l.date>addDays(t,-30) && l.date<=t && ofTrainer(tid)(S.members[l.member_id])).length;
  return { members:mine.length, today:tl.length, done:tl.filter(l=>l.status==="done").length, month, low:mine.filter(m=>leftOf(m)<=3).length };
}
function viewTrainers(){
  const ts = trainerList(), t = todayStr();
  const allToday = lessonsOn(t, () => true), allDone = allToday.filter(l=>l.status==="done").length;
  const unassigned = Object.values(S.members).filter(m => !m.trainer_id || !S.trainers[m.trainer_id]).length;
  let h = pageHead("트레이너") + `<div class="counters" style="grid-template-columns:repeat(3,1fr)">
      <div class="cnt"><div class="disc">${ts.length}</div><span>트레이너</span></div>
      <div class="cnt"><div class="disc">${Object.keys(S.members).length}</div><span>센터 회원</span></div>
      <div class="cnt"><div class="disc"><span>${allDone}<small style="font-size:.55em;color:var(--muted)">/${allToday.length}</small></span></div><span>오늘 완료</span></div></div>`;
  h += `<div class="tgrid">` + ts.map(tr => {
    const s = trainerStats(tr.id);
    return `<button class="tcard" data-trainer="${esc(tr.id)}">
      <div class="who"><div class="av">${esc(initial(tr.name))}</div><div class="grow"><div class="name">${esc(tr.name)}${me&&tr.id===me.id?" (나)":""}</div><div class="sub">${esc(tr.email)}</div></div>
        ${tr.role==="admin"?'<span class="pill sun">대표</span>':'<span class="pill hot">트레이너</span>'}</div>
      <div class="tstats"><div><b>${s.members}</b><span>담당 회원</span></div><div><b>${s.done}/${s.today}</b><span>오늘 수업</span></div><div><b>${s.month}</b><span>30일 수업</span></div></div>
      ${s.low?`<div class="sub" style="color:var(--bad)">재등록 챙길 회원 ${s.low}명</div>`:""}</button>`;
  }).join("") + `</div>`;
  if (unassigned) h += `<div class="card"><div class="card-head"><h2>담당 미지정 회원</h2><span class="pill warn">${unassigned}명</span></div><div class="list">${Object.values(S.members).filter(m => !m.trainer_id || !S.trainers[m.trainer_id]).sort(byName).map(m=>memberRow(m,false)).join("")}</div></div>`;
  if (isAdmin()) h += `<button class="btn primary block" data-act="newTrainer">트레이너 추가</button>`;
  else h += `<p class="hint">트레이너 추가와 내보내기는 대표만 할 수 있어요.</p>`;
  return h;
}
function render(){
  if ($("#appView").hidden) return;
  $("#demoBanner").hidden = !DEMO;
  $("#avatarBtn").textContent = initial(me && me.name);
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab===tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  const v = $("#view"), hadFocus = document.activeElement && document.activeElement.id==="q";
  v.innerHTML = tab==="schedule" ? viewSchedule() : tab==="members" ? viewMembers() : tab==="trainers" ? viewTrainers() : viewToday();
  if (hadFocus){ const q=$("#q"); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
  if (tab==="schedule"){ const on=v.querySelector(".day.on"); if (on) on.scrollIntoView({inline:"center",block:"nearest"}); }
}

/* ================= 시트 ================= */
function openSheet(html, mount){
  $("#layer").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sc = $("#scrim");
  sc.addEventListener("click", e => { if (e.target===sc || e.target.closest("[data-close]")) closeSheet(); });
  mount && mount(sc.querySelector(".sheet"));
}
function closeSheet(){ $("#layer").innerHTML = ""; }
const head = t => `<div class="sheet-head"><h3>${t}</h3><button class="btn ghost small" data-close>닫기</button></div>`;
const trainerOptions = sel => trainerList().map(t => `<option value="${esc(t.id)}" ${t.id===sel?"selected":""}>${esc(tName(t.id))}</option>`).join("") + `<option value="" ${!sel?"selected":""}>담당 미지정</option>`;

function memberForm(m, presetTrainer){
  m = m || {};
  openSheet(`${head(m.id?"회원 정보 수정":"회원 등록")}
    <form id="mf" class="sec">
      <div class="field"><label for="m_name">이름</label><input id="m_name" required maxlength="30" value="${esc(m.name)}"></div>
      <div class="field"><label for="m_phone">전화번호</label><input id="m_phone" inputmode="tel" maxlength="20" value="${esc(m.phone)}" placeholder="010-0000-0000"></div>
      <div class="field"><label for="m_tr">담당 트레이너</label><select id="m_tr">${trainerOptions(m.id ? m.trainer_id : (presetTrainer || (me && me.id)))}</select></div>
      <div class="field"><label for="m_goal">운동 목표</label><input id="m_goal" maxlength="60" value="${esc(m.goal)}" placeholder="예: 체지방 감량, 거북목 교정"></div>
      ${m.id ? "" : `<div class="field"><label for="m_total">등록 세션</label><div class="chips" id="pk">${[10,20,30,50].map(n=>`<button type="button" class="chip ${n===20?"on":""}" data-n="${n}">${n}회</button>`).join("")}</div>
        <input id="m_total" type="number" min="1" max="500" value="20" inputmode="numeric"></div>`}
      <div class="field"><label for="m_memo">메모</label><textarea id="m_memo" maxlength="500" placeholder="부상 이력, 선호 시간 등">${esc(m.memo)}</textarea></div>
      <button class="btn primary block" type="submit">${m.id?"저장":"등록"}</button>
    </form>`, s => {
    const pk = s.querySelector("#pk");
    pk && pk.addEventListener("click", e => { const c=e.target.closest(".chip"); if(!c) return; pk.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c)); s.querySelector("#m_total").value=c.dataset.n; });
    s.querySelector("#mf").addEventListener("submit", async e => {
      e.preventDefault();
      const name = s.querySelector("#m_name").value.trim(); if (!name) return;
      const row = { id:m.id, name, phone:s.querySelector("#m_phone").value.trim(), goal:s.querySelector("#m_goal").value.trim(), memo:s.querySelector("#m_memo").value.trim(),
        trainer_id: s.querySelector("#m_tr").value || null, total: m.id ? (m.total||0) : Math.max(1, parseInt(s.querySelector("#m_total").value,10)||1) };
      if (!m.id) row.created_at = todayStr();
      const r = await safe(() => api.save("members", row), m.id ? "저장했어요" : "회원을 등록했어요");
      if (r){ closeSheet(); if (!m.id && r.id) memberDetail(r.id); }
    });
  });
}
function memberDetail(id){
  const m = S.members[id]; if (!m) return;
  const left = leftOf(m), used = usedOf(id), t = todayStr();
  const hist = Object.values(S.lessons).filter(l=>l.member_id===id && l.status==="done").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const next = Object.values(S.lessons).filter(l=>l.member_id===id && l.status==="booked" && l.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  openSheet(`${head(esc(m.name))}
    <div class="big"><b>${left}</b><span>회 남음 · 총 ${m.total}회 중 ${used}회 진행</span></div>
    <dl class="kv">
      <div><dt>담당</dt><dd>${esc(tName(m.trainer_id))}</dd></div>
      <div><dt>전화번호</dt><dd style="user-select:all">${esc(m.phone||"-")}</dd></div>
      <div><dt>목표</dt><dd>${esc(m.goal||"-")}</dd></div>
      <div><dt>다음 수업</dt><dd>${next?esc(dLabel(next.date)+" "+next.time):"없음"}</dd></div>
      <div><dt>등록일</dt><dd>${esc(m.created_at||"-")}</dd></div>
    </dl>
    ${m.memo?`<div class="hist"><div class="h">${esc(m.memo)}</div></div>`:""}
    <div class="actions"><button class="btn primary" data-act="book">수업 잡기</button><button class="btn ghost" data-act="renew">세션 추가</button><button class="btn ghost" data-act="edit">정보 수정</button></div>
    <div id="renewBox"></div>
    <h2 class="t">수업 기록 <span class="sub">(${hist.length})</span></h2>
    <div class="hist">${hist.length ? hist.slice(0,50).map(l=>`<div class="h"><div class="d">${esc(dLabel(l.date))} ${esc(l.time)}</div>${esc(l.note||"기록 없음")}</div>`).join("") : '<div class="h sub">아직 완료한 수업이 없어요</div>'}</div>
    <div id="delBox"><button class="btn danger small" data-act="askDel">회원 삭제</button></div>`, s => {
    s.addEventListener("click", async e => {
      const add = e.target.closest("[data-add]");
      if (add){ const n=+add.dataset.add; if (await safe(() => api.save("members", Object.assign({}, m, {total:(m.total||0)+n})), n+"회 추가했어요")) memberDetail(id); return; }
      const a = e.target.closest("[data-act]"); if (!a) return;
      switch(a.dataset.act){
        case "book": lessonForm(null, id); break;
        case "edit": memberForm(m); break;
        case "renew": s.querySelector("#renewBox").innerHTML = `<div class="confirm">추가할 세션 수를 골라 주세요<div class="chips">${[5,10,20,30].map(n=>`<button class="chip" data-add="${n}">+${n}회</button>`).join("")}</div></div>`; break;
        case "askDel": s.querySelector("#delBox").innerHTML = `<div class="confirm">${esc(m.name)} 회원과 수업 기록을 모두 지울까요? 되돌릴 수 없어요.<div class="actions"><button class="btn danger small" data-act="doDel">삭제</button><button class="btn ghost small" data-act="noDel">취소</button></div></div>`; break;
        case "noDel": memberDetail(id); break;
        case "doDel": if (await safe(() => api.remove("members", id), "삭제했어요")) closeSheet(); break;
      }
    });
  });
}
function lessonForm(l, presetMember){
  const vis = memberList(), ms = vis.length ? vis : allMembers();
  const keep = (l && l.member_id) || presetMember;
  if (keep && !ms.some(m=>m.id===keep) && S.members[keep]) ms.unshift(S.members[keep]);
  if (!ms.length){ toast("먼저 회원을 등록해 주세요"); memberForm(); return; }
  l = l || {};
  const mid = keep || ms[0].id, date = l.date || selDay || todayStr();
  const defT = pad(Math.min(22, new Date().getHours()+1))+":00";
  openSheet(`${head(l.id?"수업 시간 변경":"수업 잡기")}
    <form id="lf" class="sec">
      <div class="field"><label for="l_m">회원</label><select id="l_m">${ms.map(m=>`<option value="${esc(m.id)}" ${m.id===mid?"selected":""}>${esc(m.name)} · ${leftOf(m)}회 남음</option>`).join("")}</select></div>
      <div class="two"><div class="field"><label for="l_d">날짜</label><input id="l_d" type="date" required value="${esc(date)}"></div>
        <div class="field"><label for="l_t">시간</label><input id="l_t" type="time" required step="600" value="${esc(l.time||defT)}"></div></div>
      <button class="btn primary block" type="submit">${l.id?"저장":"일정 추가"}</button>
    </form>`, s => {
    s.querySelector("#lf").addEventListener("submit", async e => {
      e.preventDefault();
      const row = { id:l.id, member_id:s.querySelector("#l_m").value, date:s.querySelector("#l_d").value, time:s.querySelector("#l_t").value, status:l.status||"booked", note:l.note||"" };
      if (!row.date || !row.time) return;
      if (await safe(() => api.save("lessons", row), l.id?"저장했어요":"일정을 추가했어요")){ selDay = row.date; closeSheet(); render(); }
    });
  });
}
function lessonDetail(lid){
  const l = S.lessons[lid]; if (!l) return;
  const m = S.members[l.member_id], done = l.status==="done", noLeft = m && leftOf(m)===0;
  openSheet(`${head(esc(m?m.name:"수업"))}
    <div class="sub" style="white-space:normal">${esc(dLabel(l.date))} ${esc(l.time)} · ${done?"완료한 수업":"예정된 수업"}${m?` · ${esc(tName(m.trainer_id))} · ${leftOf(m)}회 남음`:""}</div>
    <div class="field"><label for="l_note">오늘 운동 기록</label><textarea id="l_note" maxlength="1000" placeholder="예: 스쿼트 40kg 5x5, 데드리프트 폼 교정. 다음엔 하체 볼륨 올리기">${esc(l.note)}</textarea></div>
    ${done ? `<button class="btn primary block" data-act="saveNote">기록 저장</button><button class="btn ghost block" data-act="undo">완료 취소 (세션 되돌리기)</button>`
      : `<button class="btn primary block" data-act="finish" ${noLeft?"disabled":""}>수업 완료 · 세션 1회 차감</button>
         ${noLeft?'<p class="note">남은 세션이 없어요. 회원 화면에서 세션을 추가해 주세요.</p>':""}
         <div class="actions"><button class="btn ghost" data-act="move">시간 변경</button><button class="btn ghost" data-act="cancel">수업 취소</button>${m?'<button class="btn ghost" data-act="member">회원 보기</button>':""}</div>`}
    <div id="cancelBox"></div>`, s => {
    s.addEventListener("click", async e => {
      const a = e.target.closest("[data-act]"); if (!a) return;
      const note = s.querySelector("#l_note").value.trim(), base = Object.assign({}, l, {note});
      switch(a.dataset.act){
        case "finish": if (await safe(() => api.save("lessons", Object.assign(base,{status:"done"})))){ closeSheet(); toast("수업 완료! " + (m ? leftOf(m)+"회 남았어요" : "")); } break;
        case "saveNote": if (await safe(() => api.save("lessons", Object.assign(base,{status:"done"})), "기록을 저장했어요")) closeSheet(); break;
        case "undo": if (await safe(() => api.save("lessons", Object.assign(base,{status:"booked"})), "완료를 취소했어요")) closeSheet(); break;
        case "cancel": s.querySelector("#cancelBox").innerHTML = `<div class="confirm">이 수업 일정을 지울까요?<div class="actions"><button class="btn danger small" data-act="doCancel">수업 취소</button><button class="btn ghost small" data-close>그대로 두기</button></div></div>`; break;
        case "doCancel": if (await safe(() => api.remove("lessons", lid), "수업을 취소했어요")) closeSheet(); break;
        case "move": lessonForm(l); break;
        case "member": memberDetail(l.member_id); break;
      }
    });
  });
}
function trainerDetail(tid){
  const tr = S.trainers[tid]; if (!tr) return;
  const s0 = trainerStats(tid), t = todayStr();
  const mine = Object.values(S.members).filter(m => m.trainer_id===tid).sort(byName);
  const tl = lessonsOn(t, ofTrainer(tid));
  const canManage = isAdmin() && (!me || tid!==me.id);
  openSheet(`${head(esc(tr.name))}
    <div class="sub" style="white-space:normal">${esc(tr.email)} · ${tr.role==="admin"?"대표":"트레이너"}</div>
    <div class="tstats"><div><b>${s0.members}</b><span>담당 회원</span></div><div><b>${s0.done}/${s0.today}</b><span>오늘 수업</span></div><div><b>${s0.month}</b><span>30일 수업</span></div></div>
    <h2 class="t">오늘 일정</h2>
    ${tl.length ? `<div class="list">${tl.map(lessonRow).join("")}</div>` : '<div class="emptyline">오늘 수업이 없어요</div>'}
    <h2 class="t">담당 회원</h2>
    ${mine.length ? `<div class="list">${mine.map(m=>memberRow(m,false)).join("")}</div>` : '<div class="emptyline">담당 회원이 없어요</div>'}
    <div class="actions"><button class="btn primary" data-act="addFor">이 트레이너에게 회원 등록</button>
      ${canManage ? `<button class="btn ghost" data-act="role">${tr.role==="admin"?"트레이너로 변경":"대표 권한 주기"}</button><button class="btn danger" data-act="askOut">내보내기</button>` : ""}</div>
    <div id="outBox"></div>`, s => {
    s.addEventListener("click", async e => {
      const ml = e.target.closest("[data-member]"); if (ml){ memberDetail(ml.dataset.member); return; }
      const ll = e.target.closest("[data-lesson]"); if (ll){ lessonDetail(ll.dataset.lesson); return; }
      const a = e.target.closest("[data-act]"); if (!a) return;
      switch(a.dataset.act){
        case "addFor": memberForm(null, tid); break;
        case "role": if (await safe(() => api.save("trainers", Object.assign({}, tr, {role: tr.role==="admin"?"trainer":"admin"})), "권한을 바꿨어요")) trainerDetail(tid); break;
        case "askOut": s.querySelector("#outBox").innerHTML = `<div class="confirm">${esc(tr.name)} 트레이너를 내보낼까요? 더 이상 데이터를 볼 수 없고, 담당 회원 ${mine.length}명은 '담당 미지정'이 돼요.<div class="actions"><button class="btn danger small" data-act="doOut">내보내기</button><button class="btn ghost small" data-act="noOut">취소</button></div></div>`; break;
        case "noOut": trainerDetail(tid); break;
        case "doOut": if (await safe(() => api.remove("trainers", tid), "내보냈어요")) closeSheet(); break;
      }
    });
  });
}
function trainerForm(){
  openSheet(`${head("트레이너 추가")}
    <form id="tf" class="sec">
      <div class="field"><label for="t_name">이름</label><input id="t_name" required maxlength="20"></div>
      <div class="field"><label for="t_email">이메일</label><input id="t_email" type="email" required inputmode="email" placeholder="이 이메일로 가입하면 바로 쓸 수 있어요"></div>
      <div class="field"><label for="t_role">권한</label><select id="t_role"><option value="trainer">트레이너</option><option value="admin">대표 (트레이너 관리 가능)</option></select></div>
      <button class="btn primary block" type="submit">추가</button>
      <p class="note">추가한 뒤 사이트 주소를 동료에게 보내고, 이 이메일로 "처음이에요"에서 가입하라고 알려주세요.</p>
    </form>`, s => {
    s.querySelector("#tf").addEventListener("submit", async e => {
      e.preventDefault();
      const email = s.querySelector("#t_email").value.trim().toLowerCase();
      if (Object.values(S.trainers).some(t => (t.email||"").toLowerCase()===email)){ toast("이미 등록된 이메일이에요"); return; }
      if (await safe(() => api.save("trainers", {name:s.querySelector("#t_name").value.trim(), email, role:s.querySelector("#t_role").value}), "트레이너를 추가했어요")) closeSheet();
    });
  });
}
function accountSheet(){
  openSheet(`${head("내 계정")}
    <dl class="kv"><div><dt>이름</dt><dd>${esc(me?me.name:"-")}</dd></div><div><dt>이메일</dt><dd>${esc(me?me.email:"-")}</dd></div><div><dt>권한</dt><dd>${isAdmin()?"대표":"트레이너"}</dd></div></dl>
    <button class="btn ghost block" data-act="logout">로그아웃</button>`, s => {
    s.addEventListener("click", e => { if (e.target.closest("[data-act='logout']")) logout(); });
  });
}
function menuSheet(){
  openSheet(`${head("메뉴")}
    <div class="list">
      <div class="row tap" data-go="today"><div class="grow"><div class="name">오늘</div><div class="sub">오늘 수업과 마무리 현황</div></div></div>
      <div class="row tap" data-go="schedule"><div class="grow"><div class="name">스케줄</div><div class="sub">날짜별 수업 일정</div></div></div>
      <div class="row tap" data-go="members"><div class="grow"><div class="name">회원</div><div class="sub">남은 세션, 수업 기록</div></div></div>
      <div class="row tap" data-go="trainers"><div class="grow"><div class="name">트레이너</div><div class="sub">트레이너별 현황${isAdmin()?", 추가·내보내기":""}</div></div></div>
      <div class="row tap" data-go="newMember"><div class="grow"><div class="name">회원 등록</div></div></div>
    </div>`, s => {
    s.addEventListener("click", e => { const r = e.target.closest("[data-go]"); if (!r) return; closeSheet();
      if (r.dataset.go==="newMember") memberForm(); else { tab = r.dataset.go; store.set("sg_tab",tab); window.scrollTo(0,0); render(); } });
  });
}

/* ================= 이벤트 ================= */
document.querySelector("nav.tabs").addEventListener("click", e => { const b=e.target.closest("[data-tab]"); if (!b) return; tab=b.dataset.tab; store.set("sg_tab",tab); window.scrollTo(0,0); render(); });
$("#view").addEventListener("click", e => {
  const sc = e.target.closest("[data-scope]"); if (sc){ scope=sc.dataset.scope; store.set("sg_scope",scope); render(); return; }
  const d = e.target.closest("[data-day]"); if (d){ selDay=d.dataset.day; render(); return; }
  const tr = e.target.closest("[data-trainer]"); if (tr){ trainerDetail(tr.dataset.trainer); return; }
  const m = e.target.closest("[data-member]"); if (m){ memberDetail(m.dataset.member); return; }
  const l = e.target.closest("[data-lesson]"); if (l){ lessonDetail(l.dataset.lesson); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act==="newLesson") lessonForm();
  if (a.dataset.act==="newMember") memberForm();
  if (a.dataset.act==="newTrainer") trainerForm();
});
$("#view").addEventListener("input", e => { if (e.target.id==="q"){ query=e.target.value; render(); } });
$("#fab").addEventListener("click", () => tab==="members" ? memberForm() : tab==="trainers" ? (isAdmin() ? trainerForm() : memberForm()) : lessonForm());
$("#avatarBtn").addEventListener("click", accountSheet);
$("#menuBtn").addEventListener("click", menuSheet);
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSheet(); });

/* ================= 로그인 ================= */
let mode = "login";
$("#authForm").addEventListener("click", e => {
  const c = e.target.closest("[data-mode]"); if (!c) return;
  mode = c.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach(x => x.classList.toggle("on", x===c));
  $("#nameField").hidden = mode!=="signup";
  $("#authBtn").textContent = mode==="signup" ? "가입하기" : "로그인";
  $("#a_pw").autocomplete = mode==="signup" ? "new-password" : "current-password";
  $("#authErr").textContent = "";
});
$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#a_email").value.trim(), password = $("#a_pw").value, btn = $("#authBtn");
  if (!sb){ $("#authErr").textContent = "아직 Supabase가 연결되지 않았어요."; return; }
  btn.disabled = true; $("#authErr").textContent = "";
  try {
    const res = mode==="signup"
      ? await sb.auth.signUp({ email, password, options:{ data:{ name:$("#a_name").value.trim() } } })
      : await sb.auth.signInWithPassword({ email, password });
    if (res.error) throw res.error;
    if (mode==="signup" && !res.data.session) $("#authErr").textContent = "가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.";
  } catch(err){
    const msg = (err && err.message) || "";
    $("#authErr").textContent = /Invalid login/i.test(msg) ? "이메일이나 비밀번호가 맞지 않아요."
      : /already registered/i.test(msg) ? "이미 가입된 이메일이에요. 로그인해 주세요."
      : /Email not confirmed/i.test(msg) ? "이메일 인증이 아직 안 됐어요. 받은 메일의 링크를 눌러 주세요."
      : /Password/i.test(msg) ? "비밀번호는 6자 이상으로 해 주세요."
      : "로그인하지 못했어요. 잠시 후 다시 해 주세요.";
  } finally { btn.disabled = false; }
});
async function logout(){ closeSheet(); if (sb) await sb.auth.signOut(); else toast("미리보기 모드에서는 로그아웃이 없어요"); }
$("#logout2").addEventListener("click", logout);
$("#recheck").addEventListener("click", () => enter());

/* ================= 시작 ================= */
let channel = null, reloadTimer = null;
async function enter(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ show("authView"); return; }
  const email = (session.user.email||"").toLowerCase();
  try { await api.loadAll(); } catch(e){ console.error(e); toast("데이터를 불러오지 못했어요. 새로고침해 주세요."); }
  me = Object.values(S.trainers).find(t => (t.email||"").toLowerCase()===email) || null;
  if (!me){ $("#pendingEmail").textContent = email; show("pendingView"); return; }
  show("appView"); render();
  if (!channel){
    channel = sb.channel("skygym-live")
      .on("postgres_changes", { event:"*", schema:"public" }, () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(async () => { try { await api.loadAll(); render(); } catch(e){} }, 400); })
      .subscribe();
  }
}
if (DEMO){ seedDemo(); show("appView"); render(); }
else if (LIBFAIL){ show("authView"); $("#authErr").textContent = "로그인 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."; }
else {
  sb.auth.onAuthStateChange(ev => {
    if (ev==="SIGNED_OUT"){ if (channel){ sb.removeChannel(channel); channel=null; } S.members={}; S.lessons={}; S.trainers={}; me=null; show("authView"); return; }
    if (ev==="SIGNED_IN" || ev==="INITIAL_SESSION") setTimeout(enter, 0);
  });
}
document.addEventListener("visibilitychange", async () => { if (!DEMO && !document.hidden && me){ try { await api.loadAll(); render(); } catch(e){} } });
})();
</script>
</body>
</html>
